# SclogInstance CRD (06-kubernetes-productization.md §4.2)
#
# One cloud product = four artifacts (06§4.1):
#   1. product definition (catalogue registration — svc-catalog, M-7.5)
#   2. CRD              (this file — the desired-state model)
#   3. Operator         (rc-logservice — provision/operate engine, Go)
#   4. metering point   (status.usage → cloud.metering.usage.raw)
#
# 日志服务 SCLOG (M-7.5, 09-roadmap §4.3 M-7, P1): a managed log service
# productizing the platform's own Vector-collection + ClickHouse-storage
# operational experience (09§4.2 "复用平台自身运维经验产品化"). The instance is
# REGIONAL (log ingestion is global within a region; cross-AZ storage is a
# replica flag, not a placement constraint). POSTPAID by stored capacity
# (storage_gb_hour, HOUR) plus ingestion volume (ingestion_gb, USAGE). Fulfilled
# by DriverK8s, bound in provision.Registry.BindProduct("sclog", DriverK8s).
#
# The instance is the INTENT layer; the actual Vector pipeline setup and the
# ClickHouse table provisioning run inside the resource reconcile loop
# (06§4.1). Retention is ENFORCED: every reconcile tick, the executor expires
# partitions past retentionDays — log storage never grows unbounded.
#
# The four iron rules this schema enforces (same as sceci-instance-crd.yaml):
#   * the CR is the only fact interface — no SSH, no reaching into internals
#   * status is machine-readable: structured phase + conditions, never a log
#   * the Operator is idempotent and re-entrant
#   * no metering, no launch — status.usage is required, not optional

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scloginstances.products.cloud.platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # CRDs before the Operator that uses them
spec:
  group: products.cloud.platform
  scope: Namespaced
  names:
    kind: SclogInstance
    listKind: SclogInstanceList
    plural: scloginstances
    singular: scloginstance
    shortNames: [sclog]
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tenant
          type: string
          jsonPath: .metadata.labels['cloud\.platform/tenant']
        - name: Edition
          type: string
          jsonPath: .spec.edition
        - name: Retention
          type: string
          jsonPath: .spec.params.retentionDays
        - name: Storage
          type: string
          jsonPath: .spec.params.storageGb
        - name: Suspended
          type: boolean
          jsonPath: .spec.suspend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [edition, params]
              properties:
                edition:
                  type: string
                  description: >
                    Registered SKU edition (standard / pro). The pro tier raises
                    storageGb capacity and enables cross-AZ storage replica.
                  enum: [standard, pro]
                params:
                  type: object
                  description: Log service parameters.
                  required: [retentionDays, storageGb]
                  properties:
                    retentionDays:
                      type: integer
                      minimum: 1
                      maximum: 3650
                      description: >
                        How long log partitions are kept before expiry. Positive
                        retention is ENFORCED: a partition past its keep-by is
                        dropped every reconcile tick. (Unlike backup, log
                        retention has no 0=forever — unbounded log growth is a
                        disk-full outage waiting to happen.)
                    storageGb:
                      type: integer
                      minimum: 10
                      maximum: 100000
                      description: >
                        Provisioned ClickHouse storage capacity in GB. Billed
                        per gb_hour while the instance is running.
                    crossAz:
                      type: boolean
                      default: false
                      description: >
                        Cross-AZ storage replica flag. When true the executor
                        replicates the ClickHouse storage to a second AZ (the
                        copy is the executor's job; the instance carries the
                        intent — model先行). The pro edition sets this on.
                    ingestEndpoint:
                      type: string
                      description: >
                        The Vector ingestion endpoint exposed to clients. Set
                        by the Operator on first converge; clients ship logs here.
                    vpcId:
                      type: string
                      description: SCVPC network boundary (decision R-02).
                suspend:
                  type: boolean
                  default: false
                  description: >
                    Arrears freeze. The Operator stops accepting new ingestion
                    but NEVER deletes existing log partitions — a suspended
                    instance must resume intact when the customer pays
                    (01§5.4 D8). Existing logs remain queryable and expire on
                    their own retention.
                region:
                  type: string
                  pattern: '^(cn|ap|us|eu)-[a-z]+-[0-9]+$'
                  description: REGIONAL product (M-6, 00§4.4) — no zone field.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: >
                    Observed state. This is EVIDENCE, not authority: the
                    platform's resource_instance.status is the source of truth
                    (adjudication S21). svc-orchestrator maps this phase onto a
                    proposed transition and validates it against its own state
                    machine.
                  enum: [Pending, Provisioning, Ready, Modifying, Suspended, Failed, Deleting]
                observedGeneration:
                  type: integer
                  format: int64
                  description: >
                    The spec generation this status reflects. A status whose
                    observedGeneration lags metadata.generation describes the
                    OLD spec.
                conditions:
                  type: array
                  description: >
                    Structured conditions. Consumers key on type/status/reason,
                    never on message — parsing a human string to decide whether
                    a customer is billed breaks on the first wording change.
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        enum: [IngestionReady, StorageReady, Degraded]
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                usage:
                  type: array
                  description: >
                    Metering readings, a FIRST-CLASS status field (06§4.1 rule
                    4). A product that cannot report usage cannot be launched.
                    These are published to cloud.metering.usage.raw. SCLOG is
                    billed by stored capacity (gb_hour, HOUR) plus ingestion
                    volume (ingestion_gb, USAGE).
                  items:
                    type: object
                    required: [meteringItem, quantity, windowStart, windowSeconds]
                    properties:
                      meteringItem:
                        type: string
                        description: Must be registered in metering_catalog before launch.
                        enum: [storage_gb_hour, ingestion_gb]
                      quantity:
                        type: string
                        description: >
                          Decimal STRING, never a float. Float accumulation
                          across millions of hourly rows drifts, and a drifting
                          quantity produces a bill nobody can reconcile.
                        pattern: '^[0-9]+(\.[0-9]{1,6})?$'
                      windowStart: { type: string, format: date-time }
                      windowSeconds: { type: integer, minimum: 1, maximum: 3600 }
                message:
                  type: string
                  description: Human-facing detail only; never parsed by consumers.
---
# Example CR, showing the mandatory labels and the finalizer.
#
# The object name is the platform resource id verbatim (06§4.2), so a cluster
# operator and a support engineer reading a bill are looking at the same string.
apiVersion: products.cloud.platform/v1
kind: SclogInstance
metadata:
  name: sclog-cn-north-1-01-7a8b9c0d
  namespace: plat-logservice
  labels:
    # All four are mandatory. Without them a cluster object cannot be
    # attributed to a tenant, which breaks isolation, billing and audit at once.
    cloud.platform/tenant: "100123"
    cloud.platform/project: "1"
    cloud.platform/product: sclog
    cloud.platform/instance: sclog-cn-north-1-01-7a8b9c0d
  finalizers:
    # The Operator pushes a FINAL metering reading before removing this. "CR
    # truly gone" is the release-complete signal; without the finalizer, deletion
    # races the last usage report and the customer is mis-billed for the tail.
    - products.cloud.platform/cleanup
spec:
  edition: standard
  region: cn-north-1
  suspend: false
  params:
    retentionDays: 30
    storageGb: 200
    crossAz: false
    ingestEndpoint: "vector-tcp.sclog-cn-north-1-01-7a8b9c0d:9000"
    vpcId: scvpc-cn-north-1-01-11223344
status:
  phase: Ready
  observedGeneration: 1
  conditions:
    - type: IngestionReady
      status: "True"
      reason: VectorRunning
      message: vector ingestion agent accepting logs
      lastTransitionTime: "2026-08-16T03:04:09Z"
    - type: StorageReady
      status: "True"
      reason: ClickHouseReady
      message: clickhouse storage ready, retention enforced
      lastTransitionTime: "2026-08-16T03:04:09Z"
  # MIXED metering: stored capacity in gb_hour (HOUR) + ingestion volume (USAGE).
  usage:
    - meteringItem: storage_gb_hour
      quantity: "200"
      windowStart: "2026-08-16T03:05:00Z"
      windowSeconds: 3600
    - meteringItem: ingestion_gb
      quantity: "12.5"
      windowStart: "2026-08-16T03:05:00Z"
      windowSeconds: 3600
