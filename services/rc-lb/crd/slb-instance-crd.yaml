# EULB instance CRD (06-kubernetes-productization.md §4.2)
#
# One cloud product = four artifacts (06§4.1):
#   1. product definition (catalogue registration — svc-catalog, M-7.2)
#   2. CRD              (this file — the desired-state model)
#   3. Operator         (rc-lb — provision/operate engine, Go)
#   4. metering point   (status.usage → cloud.metering.usage.raw)
#
# EULB 辰云负载均衡 (M-7.2, 09-roadmap §4.3 M-7, P0): a four-layer (TCP/UDP) +
# seven-layer (HTTP/HTTPS) load balancer that spans AZs — it is the cross-AZ
# entry point (REGIONAL, unlike the ZONAL compute products). The kernel is
# APISIX (L7) + LVS/IPVS (L4), abstracted behind one CR (09 §4.2), fulfilled by
# DriverK8s (bound in provision.Registry.BindProduct("eulb", DriverK8s)).
#
# The four iron rules this schema enforces (same as euecs-instance-crd.yaml):
#   * the CR is the only fact interface — no SSH, no reaching into internals
#   * status is machine-readable: structured phase + conditions, never a log
#     line to be parsed
#   * the Operator is idempotent and re-entrant
#   * no metering, no launch — status.usage is required, not optional
#
# Adding a product means copying this file and changing the names. That is the
# "填槽" onboarding path (01§7.3): a new product should be configuration work,
# not platform work.

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: slbinstances.products.cloud.platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # CRDs before the Operator that uses them
spec:
  group: products.cloud.platform
  scope: Namespaced
  names:
    kind: SlbInstance
    listKind: SlbInstanceList
    plural: slbinstances
    singular: slbinstance
    shortNames: [eulb]
  versions:
    - name: v1
      served: true
      storage: true
      # Printer columns so `kubectl get eulb` answers the questions an
      # operator actually asks, without a describe.
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Tenant
          type: string
          jsonPath: .metadata.labels['cloud\.platform/tenant']
        - name: Type
          type: string
          jsonPath: .spec.params.type
        - name: Suspended
          type: boolean
          jsonPath: .spec.suspend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [edition, params]
              properties:
                edition:
                  type: string
                  description: >
                    Registered SKU edition. Only values registered in
                    svc-catalog are accepted; an unregistered edition has no
                    price and no metering item, so it cannot be billed.
                  enum: [standard, general, compute-optimized, memory-optimized]
                params:
                  type: object
                  description: Purchase parameters, matching the OpenAPI create call.
                  required: [type]
                  properties:
                    type:
                      type: string
                      description: >
                        Listener layer. l7 = HTTP/HTTPS (APISIX), l4 = TCP/UDP
                        (LVS/IPVS). The CR renders the right backend for the type.
                      enum: [l4, l7]
                    listeners:
                      type: array
                      description: One or more listeners on the instance.
                      minItems: 1
                      items:
                        type: object
                        required: [port, protocol]
                        properties:
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          protocol:
                            type: string
                            enum: [HTTP, HTTPS, TCP, UDP]
                    vpcId:
                      type: string
                      description: EUVPC network boundary; an LB attaches to a VPC (decision R-02).
                    backendServers:
                      type: array
                      description: Backend endpoints the listener forwards to.
                      items:
                        type: object
                        required: [address]
                        properties:
                          address: { type: string }
                          port: { type: integer, minimum: 1, maximum: 65535 }
                          weight: { type: integer, minimum: 0, maximum: 100 }
                suspend:
                  type: boolean
                  default: false
                  description: >
                    Arrears freeze. The Operator stops forwarding but NEVER
                    deletes the listener/backend config — a suspended LB must
                    come back intact when the customer pays (01§5.4 D8). Same
                    trust-sensitive flag as every product.
                region:
                  type: string
                  pattern: '^(cn|ap|us|eu)-[a-z]+-[0-9]+$'
                zone:
                  type: string
                  description: >
                    REGIONAL product: the LB spans AZs, so zone is metadata
                    (the AZ the control-plane pod lands on), not a placement
                    constraint. The data plane forwards across AZs.
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: >
                    Observed state. This is EVIDENCE, not authority: the
                    platform's resource_instance.status is the source of truth
                    (adjudication S21). svc-orchestrator maps this phase onto a
                    proposed transition and validates it against its own state
                    machine.
                  enum: [Pending, Provisioning, Ready, Modifying, Suspended, Failed, Deleting]
                observedGeneration:
                  type: integer
                  format: int64
                  description: >
                    The spec generation this status reflects. A status whose
                    observedGeneration lags metadata.generation describes the
                    OLD spec — treating it as current is how a listener change
                    appears to have taken effect before it did.
                conditions:
                  type: array
                  description: >
                    Structured conditions. Consumers key on type/status/reason,
                    never on message — parsing a human string to decide whether
                    a customer is billed breaks on the first wording change.
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        enum: [Provisioned, ListenerReady, BackendHealth, Degraded]
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason: { type: string }
                      message: { type: string }
                      lastTransitionTime: { type: string, format: date-time }
                usage:
                  type: array
                  description: >
                    Metering readings, a FIRST-CLASS status field (06§4.1 rule
                    4). A product that cannot report usage cannot be launched.
                    These are published to cloud.metering.usage.raw. EULB is
                    billed by usage: lcu_hour (LCU capacity unit) and traffic_gb
                    (egress). Hourly settlement, same as the phase-1 postpaid
                    products.
                  items:
                    type: object
                    required: [meteringItem, quantity, windowStart, windowSeconds]
                    properties:
                      meteringItem:
                        type: string
                        description: Must be registered in metering_catalog before launch.
                        enum: [lcu_hour, traffic_gb]
                      quantity:
                        type: string
                        description: >
                          Decimal STRING, never a float. Float accumulation
                          across millions of hourly rows drifts, and a drifting
                          quantity produces a bill nobody can reconcile.
                        pattern: '^[0-9]+(\.[0-9]{1,6})?$'
                      windowStart: { type: string, format: date-time }
                      windowSeconds: { type: integer, minimum: 1, maximum: 3600 }
                endpoints:
                  type: array
                  items: { type: string }
                message:
                  type: string
                  description: Human-facing detail only; never parsed by consumers.
---
# Example CR, showing the mandatory labels and the finalizer.
#
# The object name is the platform resource id verbatim (06§4.2), so a cluster
# operator and a support engineer reading a bill are looking at the same string.
apiVersion: products.cloud.platform/v1
kind: SlbInstance
metadata:
  name: eulb-cn-north-1-01-9a0b1c2d
  namespace: plat-slb
  labels:
    # All four are mandatory. Without them a cluster object cannot be
    # attributed to a tenant, which breaks isolation, billing and audit at once.
    cloud.platform/tenant: "100123"
    cloud.platform/project: "1"
    cloud.platform/product: eulb
    cloud.platform/instance: eulb-cn-north-1-01-9a0b1c2d
  finalizers:
    # The Operator reclaims backing resources and pushes a FINAL metering
    # reading before removing this. "CR truly gone" is the release-complete
    # signal; without the finalizer, deletion races the last usage report and
    # the customer is mis-billed for their final traffic/LCUs.
    - products.cloud.platform/cleanup
spec:
  edition: standard
  region: cn-north-1
  zone: cn-north-1-a
  suspend: false
  params:
    type: l7
    listeners:
      - port: 443
        protocol: HTTPS
    vpcId: euvpc-cn-north-1-01-11223344
    backendServers:
      - address: 10.128.3.17
        port: 8080
        weight: 100
      - address: 10.128.5.22
        port: 8080
        weight: 100
status:
  phase: Ready
  observedGeneration: 1
  conditions:
    - type: ListenerReady
      status: "True"
      reason: ListenerBound
      message: HTTPS:443 listener bound
      lastTransitionTime: "2026-08-16T03:10:05Z"
    - type: BackendHealth
      status: "True"
      reason: BackendsHealthy
      message: 2/2 backends healthy
      lastTransitionTime: "2026-08-16T03:10:06Z"
    - type: Provisioned
      status: "True"
      reason: Ready
      message: load balancer is serving
      lastTransitionTime: "2026-08-16T03:10:06Z"
  usage:
    - meteringItem: lcu_hour
      quantity: "1"
      windowStart: "2026-08-16T03:11:00Z"
      windowSeconds: 3600
    - meteringItem: traffic_gb
      quantity: "0.012"
      windowStart: "2026-08-16T03:11:00Z"
      windowSeconds: 3600
  endpoints:
    - "eulb-cn-north-1.euler.emoera.com"
