worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Never record query strings: the OIDC callback carries a single-use code.
    log_format app_cloud '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout app_cloud;
    server_tokens off;
    sendfile on;
    client_max_body_size 32m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream app_cloud { server app-cloud:8080; }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;

        location = /_health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /auth/ {
            access_log off;
            error_log /dev/stderr crit;
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }
        location /api/ {
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }
        location /public/ {
            # Enrollment and registration URLs can contain narrow-purpose tokens.
            access_log off;
            error_log /dev/stderr crit;
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }
        location /public/weauth/ {
            # The verification widget is intentionally embeddable. Its challenge
            # endpoint validates each site's configured embedding domains.
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            proxy_hide_header X-Frame-Options;
            access_log off;
            error_log /dev/stderr crit;
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }
        location = /healthz {
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }
        location = /readyz {
            include /etc/nginx/app-cloud-proxy.conf;
            proxy_pass http://app_cloud;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            # Never retain an old HTML shell after a deployment.
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
