# ArgoCD App-of-Apps root (08-devops-delivery.md §4.3).
#
# The root Application points at this directory; ArgoCD syncs every child
# Application below it (dir-as-env, single trunk). Each child points at a
# per-service Helm chart under apps/<svc>/ with env-specific values from
# envs/<region>/<env>/values-overrides/. This is the single GitOps entry point.
#
# Apply once per cluster:
#   kubectl apply -f deploy/gitops-manifests/app-of-apps.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: starcloud-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.internal/starcloud/platform-manifests.git
    targetRevision: main
    # Points at the directory that holds applicationset.yaml. The include
    # filter restricts the sync to Argo CD ApplicationSet resources only —
    # the sibling Helm chart dirs (apps/), env overrides (envs/) and raw
    # platform manifests (platform/) are NOT synced as plain manifests here;
    # they are consumed by the ApplicationSet-generated Applications.
    path: deploy/gitops-manifests
    directory:
      recurse: false
      include: 'applicationset.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
