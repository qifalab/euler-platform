# ArgoCD ApplicationSet — one Application per service chart under apps/ (08§4.3).
#
# The App-of-Apps root (app-of-apps.yaml) syncs this ApplicationSet, which fans
# out to one Application per (sub-directory in apps/) × (region) × (environment).
# Each deploys the service's Helm chart to the target namespace, with
# region/env-specific values layered from
# envs/<region>/<env>/values-overrides/<svc>.yaml (dir-as-env, single trunk
# 08§4.2/§4.3; the region level is the M-8 multi-region extension — 08§12 P3
# "App of Apps 分地域"). Missing override files are tolerated via
# ignoreMissingValueFiles, so a service without region-specific tuning falls
# back to the chart defaults.
#
# Adding a new service = adding a directory under apps/; no Application edit.
# Adding a region/environment = editing the list generator elements below.
#
# Every (region, env) element deploys to its OWN cluster. All elements share
# the namespace scheme euler-<svc> and the Helm release name <svc> (so the
# in-cluster address is always http://<svc>.euler-<svc>.svc:<port>); if two
# elements pointed at the same cluster their Applications would own the same
# objects — each one's auto-sync/prune would delete or overwrite the other's,
# and every Service would select both environments' pods.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: euler-services
  namespace: argocd
spec:
  goTemplate: false
  generators:
    # matrix = (every chart dir under apps/) × (every region/env element).
    - matrix:
        generators:
          - git:
              repoURL: https://gitlab.internal/euler/platform-manifests.git
              targetRevision: main
              directories:
                - path: deploy/gitops-manifests/apps/*
          - list:
              elements:
                # One element per (region, environment), each with its own
                # destination cluster. The primary region cn-north-1 carries
                # dev/staging/prod; the remote standby cn-east-1 (两地三中心,
                # 00§4.5) carries prod only — it is the disaster-recovery
                # site, not a dev/staging surface.
                #
                # `cluster` is the Argo CD cluster NAME (destination.name),
                # one per (region, env): euler-<region>-<env>. These are
                # placeholders until each cluster is registered with
                #   argocd cluster add <kube-context> --name euler-<region>-<env>
                # An unregistered name fails the Application (Unknown
                # cluster) instead of silently deploying into the Argo CD
                # host cluster.
                - env: dev
                  region: cn-north-1
                  cluster: euler-cn-north-1-dev
                - env: staging
                  region: cn-north-1
                  cluster: euler-cn-north-1-staging
                - env: prod
                  region: cn-north-1
                  cluster: euler-cn-north-1-prod
                - env: prod
                  region: cn-east-1
                  cluster: euler-cn-east-1-prod
  template:
    metadata:
      # e.g. euler-svc-iam-cn-north-1-dev
      name: 'euler-{{path.basename}}-{{region}}-{{env}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://gitlab.internal/euler/platform-manifests.git
        targetRevision: main
        path: '{{path}}'
        helm:
          # Release name = chart dir name (not Argo's default, the
          # Application name euler-<svc>-<region>-<env>): the charts name
          # their Service/Deployment/ConfigMap after .Release.Name, and every
          # in-cluster caller and gateway route addresses
          # <svc>.euler-<svc>.svc.
          releaseName: '{{path.basename}}'
          # Region/env differences live ONLY here (08§4.2 single trunk). A
          # missing override file is fine — the chart defaults then apply as-is.
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../envs/{{region}}/{{env}}/values-overrides/{{path.basename}}.yaml'
      destination:
        # Per-(region, env) cluster, see the list generator above.
        name: '{{cluster}}'
        namespace: euler-{{path.basename}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Label every platform service namespace so the per-service
        # NetworkPolicies can admit control-plane traffic by label and deny
        # everything else (tenant workloads included).
        managedNamespaceMetadata:
          labels:
            euler.platform/plane: control
