# ArgoCD ApplicationSet — one Application per service chart under apps/ (08§4.3).
#
# The App-of-Apps root (app-of-apps.yaml) syncs this ApplicationSet, which fans
# out to one Application per (sub-directory in apps/) × (environment). Each
# deploys the service's Helm chart to the target namespace, with env-specific
# values layered from envs/<env>/values-overrides/<svc>.yaml (dir-as-env,
# single trunk 08§4.3). Missing override files are tolerated via
# ignoreMissingValueFiles, so a service without env-specific tuning falls back
# to the chart defaults.
#
# Adding a new service = adding a directory under apps/; no Application edit.
# Adding/removing an environment = editing the list generator elements below
# (each env can point at its own destination cluster).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: starcloud-services
  namespace: argocd
spec:
  goTemplate: false
  generators:
    # matrix = (every chart dir under apps/) × (every environment element).
    - matrix:
        generators:
          - git:
              repoURL: https://gitlab.internal/starcloud/platform-manifests.git
              targetRevision: main
              directories:
                - path: deploy/gitops-manifests/apps/*
          - list:
              elements:
                # One element per environment. dev/staging/prod share the repo
                # trunk (single trunk, dir-as-env 08§4.3); each env may target
                # its own cluster via `server`. Replace the staging/prod
                # server URLs when those clusters are registered in Argo CD.
                - env: dev
                  server: https://kubernetes.default.svc
                - env: staging
                  server: https://kubernetes.default.svc   # TODO: staging cluster API URL
                - env: prod
                  server: https://kubernetes.default.svc   # TODO: prod cluster API URL
  template:
    metadata:
      # e.g. starcloud-svc-iam-dev
      name: 'starcloud-{{path.basename}}-{{env}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://gitlab.internal/starcloud/platform-manifests.git
        targetRevision: main
        path: '{{path}}'
        helm:
          # Env differences live ONLY here (08§4.3 single trunk). A missing
          # override file is fine — the chart defaults then apply as-is.
          ignoreMissingValueFiles: true
          valueFiles:
            - '../../envs/{{env}}/values-overrides/{{path.basename}}.yaml'
      destination:
        server: '{{server}}'
        namespace: starcloud-{{path.basename}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
