# cn-east-1 prod overrides for svc-iam — remote standby region (00§4.5).
#
# svc-iam is a GLOBAL singleton (pkg-go/multiregion.Classify: 00§4.1 账号为全局
# 域; 09§5.2 M-8 "IAM/计费全局单例"). It runs primary in cn-north-1 and cold
# primary-standby here: scaled to zero until disaster declaration, then brought
# hot (管控面冷转热) before the DNS cutover (00§4.5; 09§5.3 C1 全局服务主备自动切换).
image:
  tag: v0.1.0
replicas: 0   # cold standby — the standby takes no writes, control plane is cold
topology:
  zoneSpread: false   # the remote site is single-AZ (AZ C 只读/灾备), not dual-AZ

# Production mode: services refuse to start without their secrets
# (pkg-go/runmode; README「生产必需配置」) and never seed demo data. web-auth
# now persists to account_db: EULER_DB_DSN, EULER_KMS_MASTER_KEY and
# EULER_IDENTITY_PEPPER are required (Secret euler-platform-secrets);
# EULER_SVC_NOTIFY_URL comes from the chart default.
extraEnv:
  EULER_ENV: prod
  # Refresh cookie scope for account→console SSO (web-auth
  # EULER_COOKIE_DOMAIN; unset = host-only).
  EULER_COOKIE_DOMAIN: ".euler.emoera.com"
  # Registration needs the code mailed by POST /api/auth/register/send-code
  # (web-auth register.go; unset = the code is optional).
  EULER_REGISTER_REQUIRE_EMAIL_CODE: "1"
