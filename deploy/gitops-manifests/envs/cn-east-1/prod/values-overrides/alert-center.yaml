# cn-east-1 prod overrides for alert-center — remote standby region (00§4.5).
# REGIONAL service (pkg-go/multiregion.Classify): cold control plane, brought
# hot on failover.
image:
  tag: v0.1.0
replicas: 0   # cold standby
topology:
  zoneSpread: false

# Production mode: services refuse to start without their secrets
# (pkg-go/runmode; README「生产必需配置」) and never seed demo data.
extraEnv:
  EULER_ENV: prod
