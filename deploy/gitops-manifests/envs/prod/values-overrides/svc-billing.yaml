# prod overrides for svc-billing (values merge on top of the chart defaults).
image:
  tag: v0.1.0
replicas: 3
# M-6 dual-AZ topology (00§4.4 P2): replicas hard-spread across AZs so losing
# one AZ does not take the service down. Prod runs 3 replicas across 2 AZs as
# (2,1) — a stateless service tolerates that (any replica serves any request),
# unlike the stateful MGR/Redis topology which has its own constraints.
topology:
  zoneSpread: true
