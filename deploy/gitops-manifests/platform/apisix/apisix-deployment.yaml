# APISIX data-plane deployment — three zones (04§3.1, §3.9, §10.1)
#
# Zone split: 官网开放区 / 控制台区 / OpenAPI 区 as three independent
# Deployments sharing one 3-node etcd. Independent clusters mean a runaway
# marketing campaign on the portal cannot exhaust worker capacity serving
# paying customers' OpenAPI calls — the blast radius stops at the zone.
#
# Replicas (04§3.9): each zone ≥2, OpenAPI zone starts at 3. Single replica
# baseline is ~5k QPS; phase-1 gateway peak is 8000 QPS total (09§3.4), so
# 4 nodes at 4C8G carries it with headroom.
#
# All pods land on pool-gateway, which is tainted dedicated=gateway:NoSchedule
# so business workloads cannot be scheduled onto gateway capacity (04§2.1).

apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-sc-plugins
  namespace: mw-gateway
  annotations:
    # Platform components sync before middleware and business services
    # (08§4.3 sync-wave ordering).
    argocd.argoproj.io/sync-wave: "-10"
data:
  # Custom plugins are projected to /opt/sc-plugins (extra_lua_path in
  # config.yaml). Contents are the .lua files in ../plugins/ — ArgoCD renders
  # them in via kustomize configMapGenerator in the real manifest; inlined
  # here would duplicate the source of truth.
  README.md: |
    Populated by kustomize configMapGenerator from platform/apisix/plugins/:
      sc-auth.lua       CPS1 signature / JWT authentication
      sc-authorize.lua  action-level authorization via svc-iam CheckAccess
      sc-audit.lua      audit side-stream to Kafka cloud.sys.audit.action
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-openapi
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # gateway after middleware (-5)
  labels:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: openapi
spec:
  replicas: 3                            # OpenAPI zone starts at 3 (04§3.9)
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: openapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        cloud.platform/zone: openapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /apisix/prometheus/metrics
    spec:
      # Gateway node pool is tainted; only gateway workloads tolerate it.
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      # Spread across nodes so losing one node cannot take the zone down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
              cloud.platform/zone: openapi
      containers:
        - name: apisix
          image: apache/apisix:3.9.1-debian
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9091
              name: metrics
          env:
            - name: NACOS_APISIX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nacos-apisix-credentials
                  key: password
            - name: SC_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: sc-jwt-public-key
                  key: publicKey
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: sc-plugins
              mountPath: /opt/sc-plugins
          resources:
            # 4C8G per node (09§3.4 baseline). The signature path is CPU
            # sensitive, so requests are set generously rather than optimising
            # for density.
            requests: { cpu: "2", memory: "4Gi" }
            limits:   { cpu: "4", memory: "8Gi" }
          readinessProbe:
            httpGet: { path: /apisix/status, port: 9080 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /apisix/status, port: 9080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              # Drain before exit: stop accepting new connections, let in-flight
              # requests finish (08§6.2).
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 45
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
        - name: sc-plugins
          configMap:
            name: apisix-sc-plugins
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  # Stateful and gateway components allow at most one pod down at a time
  # (04§10.1) — voluntary disruptions must not compound with a node failure.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: openapi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix-openapi
  minReplicas: 3
  maxReplicas: 10          # growth-phase cap (04§11.1)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # 04§3.9
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  selector:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: openapi
  ports:
    - port: 80
      targetPort: 9080
      name: http
    - port: 9091
      targetPort: 9091
      name: metrics
---
# Console zone: same shape, 2 replicas, separate Deployment so console traffic
# and OpenAPI traffic cannot starve each other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-console
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        cloud.platform/zone: console
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
              cloud.platform/zone: console
      containers:
        - name: apisix
          image: apache/apisix:3.9.1-debian
          ports:
            - containerPort: 9080
            - containerPort: 9091
          env:
            - name: NACOS_APISIX_PASSWORD
              valueFrom:
                secretKeyRef: { name: nacos-apisix-credentials, key: password }
            - name: SC_JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: sc-jwt-public-key, key: publicKey }
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            - name: sc-plugins
              mountPath: /opt/sc-plugins
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits:   { cpu: "4", memory: "8Gi" }
          readinessProbe:
            httpGet: { path: /apisix/status, port: 9080 }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 15"] }
      terminationGracePeriodSeconds: 45
      volumes:
        - name: apisix-config
          configMap: { name: apisix-config }
        - name: sc-plugins
          configMap: { name: apisix-sc-plugins }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-console
  namespace: mw-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: console
---
# etcd: 3-replica StatefulSet backing all three zones (04§3.1, §3.9).
# Snapshots every 6h to the internal MinIO cluster; etcd is on the middleware
# ops checklist because an unmanaged etcd is a gateway SPOF (pit #3).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # middleware before gateway
spec:
  serviceName: apisix-etcd-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix-etcd
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      affinity:
        podAntiAffinity:
          # Hard anti-affinity: a quorum spread across one node is not a quorum.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: apisix-etcd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: bitnami/etcd:3.5.16
          env:
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"        # 8G (04§3.9)
            - name: ALLOW_NONE_AUTHENTICATION
              value: "no"
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          volumeMounts:
            - name: data
              mountPath: /bitnami/etcd
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-ssd
        resources:
          requests:
            storage: 50Gi                # 04§3.9
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-etcd
  namespace: mw-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-etcd
