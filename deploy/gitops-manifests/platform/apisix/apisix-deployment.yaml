# APISIX data-plane deployment — three zones (04§3.1, §3.9, §10.1)
#
# Zone split: 官网开放区 / 控制台区 / OpenAPI 区 as three independent
# Deployments sharing one 3-node etcd. Independent clusters mean a runaway
# marketing campaign on the portal cannot exhaust worker capacity serving
# paying customers' OpenAPI calls — the blast radius stops at the zone.
#
# Replicas (04§3.9): each zone ≥2, OpenAPI zone starts at 3. Single replica
# baseline is ~5k QPS; phase-1 gateway peak is 8000 QPS total (09§3.4), so
# 4 nodes at 4C8G carries it with headroom.
#
# All pods land on pool-gateway, which is tainted dedicated=gateway:NoSchedule
# so business workloads cannot be scheduled onto gateway capacity (04§2.1).

# NOTE: the apisix-config and apisix-eu-plugins ConfigMaps referenced by the
# volumes below are NOT declared inline — they are generated by kustomize
# (./kustomization.yaml, configMapGenerator) from config/config.yaml and
# plugins/*.lua, so the mounted files can never drift from the reviewed
# sources. Apply this stack with `kubectl apply -k platform/apisix/` (or via
# an Argo CD kustomize source), not with a bare `-f` on this file.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-openapi
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # gateway after middleware (-5)
  labels:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: openapi
spec:
  replicas: 3                            # OpenAPI zone starts at 3 (04§3.9)
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: openapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        cloud.platform/zone: openapi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /apisix/prometheus/metrics
    spec:
      # Gateway node pool is tainted; only gateway workloads tolerate it.
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      # Spread across nodes so losing one node cannot take the zone down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
              cloud.platform/zone: openapi
      containers:
        - name: apisix
          image: apache/apisix:3.9.1-debian
          ports:
            - containerPort: 9080
              name: http
            - containerPort: 9091
              name: metrics
            - containerPort: 7085
              name: status
          env:
            - name: NACOS_APISIX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nacos-apisix-credentials
                  key: password
            - name: APISIX_ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apisix-etcd-credentials
                  key: root-password
            # Internal shared secret injected upstream by eu-auth after
            # authentication (services require it via httpmw.InternalToken).
            # Exposed to the Lua workers by nginx_config.envs in config.yaml.
            - name: EULER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: euler-internal-token
                  key: token
            # SCRAM password of the eu-audit Kafka user (apisix-audit) — the
            # same value as mw-mq/kafka-scram-users[apisix-audit]. Exposed to
            # the Lua workers by nginx_config.envs in config.yaml.
            - name: EULER_KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-apisix-audit
                  key: password
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            # Custom plugins: require("apisix.plugins.eu-auth") resolves via
            # apisix.extra_lua_path (/opt/eu-plugins/?.lua) to
            # /opt/eu-plugins/apisix/plugins/eu-auth.lua.
            - name: eu-plugins
              mountPath: /opt/eu-plugins/apisix/plugins
              readOnly: true
            # JWT public key for the console-zone eu-auth plugin. Route files
            # cannot interpolate env vars, so the plugin reads this mounted
            # Secret via jwt_public_key_file.
            - name: eu-jwt
              mountPath: /opt/eu-secrets/jwt
              readOnly: true
            # Platform CA (apisix.ssl.ssl_trusted_certificate in config.yaml):
            # verifies the Kafka brokers (eu-audit) and https upstreams.
            - name: platform-ca
              mountPath: /opt/eu-secrets/platform-ca
              readOnly: true
          resources:
            # 4C8G per node (09§3.4 baseline). The signature path is CPU
            # sensitive, so requests are set generously rather than optimising
            # for density.
            requests: { cpu: "2", memory: "4Gi" }
            limits:   { cpu: "4", memory: "8Gi" }
          readinessProbe:
            httpGet: { path: /status/ready, port: 7085 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /status, port: 7085 }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              # Drain before exit: stop accepting new connections, let in-flight
              # requests finish (08§6.2).
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 45
      volumes:
        - name: apisix-config
          configMap:
            name: apisix-config
        - name: eu-plugins
          configMap:
            name: apisix-eu-plugins
        - name: eu-jwt
          secret:
            secretName: eu-jwt-public-key
        # Only ca.crt of the cert-manager Secret (platform/middleware/tls.yaml,
        # apisix-gateway-tls): the gateway needs the CA, not that leaf's key.
        - name: platform-ca
          secret:
            secretName: apisix-gateway-tls
            items:
              - { key: ca.crt, path: ca.crt }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  # Stateful and gateway components allow at most one pod down at a time
  # (04§10.1) — voluntary disruptions must not compound with a node failure.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: openapi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apisix-openapi
  minReplicas: 3
  maxReplicas: 10          # growth-phase cap (04§11.1)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # 04§3.9
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-openapi
  namespace: mw-gateway
spec:
  selector:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: openapi
  ports:
    - port: 80
      targetPort: 9080
      name: http
    - port: 9091
      targetPort: 9091
      name: metrics
---
# Console zone: same shape, 2 replicas, separate Deployment so console traffic
# and OpenAPI traffic cannot starve each other.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-console
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: apisix
    cloud.platform/zone: console
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        cloud.platform/zone: console
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apisix
              cloud.platform/zone: console
      containers:
        - name: apisix
          image: apache/apisix:3.9.1-debian
          ports:
            - containerPort: 9080
            - containerPort: 9091
            - containerPort: 7085
              name: status
          env:
            - name: NACOS_APISIX_PASSWORD
              valueFrom:
                secretKeyRef: { name: nacos-apisix-credentials, key: password }
            - name: APISIX_ETCD_PASSWORD
              valueFrom:
                secretKeyRef: { name: apisix-etcd-credentials, key: root-password }
            - name: EULER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: euler-internal-token, key: token }
            - name: EULER_KAFKA_SASL_PASSWORD     # eu-audit, as in apisix-openapi
              valueFrom:
                secretKeyRef: { name: kafka-apisix-audit, key: password }
          volumeMounts:
            - name: apisix-config
              mountPath: /usr/local/apisix/conf/config.yaml
              subPath: config.yaml
            # Same layout as apisix-openapi (apisix.extra_lua_path).
            - name: eu-plugins
              mountPath: /opt/eu-plugins/apisix/plugins
              readOnly: true
            # Mounted eu-jwt-public-key Secret, read by eu-auth via
            # jwt_public_key_file (route files cannot interpolate env vars).
            - name: eu-jwt
              mountPath: /opt/eu-secrets/jwt
              readOnly: true
            # Platform CA, as in apisix-openapi.
            - name: platform-ca
              mountPath: /opt/eu-secrets/platform-ca
              readOnly: true
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits:   { cpu: "4", memory: "8Gi" }
          readinessProbe:
            httpGet: { path: /status/ready, port: 7085 }
          livenessProbe:
            httpGet: { path: /status, port: 7085 }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 15"] }
      terminationGracePeriodSeconds: 45
      volumes:
        - name: apisix-config
          configMap: { name: apisix-config }
        - name: eu-plugins
          configMap: { name: apisix-eu-plugins }
        - name: eu-jwt
          secret: { secretName: eu-jwt-public-key }
        - name: platform-ca
          secret:
            secretName: apisix-gateway-tls
            items:
              - { key: ca.crt, path: ca.crt }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-console
  namespace: mw-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix
      cloud.platform/zone: console
---
# etcd: 3-replica StatefulSet backing all three zones (04§3.1, §3.9).
# Snapshots every 6h to the internal MinIO cluster; etcd is on the middleware
# ops checklist because an unmanaged etcd is a gateway SPOF (pit #3).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # middleware before gateway
spec:
  serviceName: apisix-etcd-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix-etcd
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      nodeSelector:
        cloud.platform/pool: gateway
      affinity:
        podAntiAffinity:
          # Hard anti-affinity: a quorum spread across one node is not a quorum.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: apisix-etcd
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          image: bitnami/etcd:3.5.16
          env:
            # Static 3-member cluster bootstrapped over the headless Service
            # (apisix-etcd-{0,1,2}.apisix-etcd-headless.mw-gateway.svc, the
            # same names config/config.yaml connects to). Without these the
            # bitnami image starts every replica as its own single-node
            # cluster: three diverging route tables and no quorum at all.
            # Bootstrap-only settings — a member whose data dir already holds
            # a cluster ignores them, so PVCs left from single-node starts
            # must be wiped (or the members re-joined) once.
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_ON_K8S
              value: "yes"
            - name: ETCD_NAME
              value: "$(MY_POD_NAME)"
            - name: ETCD_DATA_DIR
              value: /bitnami/etcd/data
            - name: ETCD_CLUSTER_DOMAIN
              value: apisix-etcd-headless.mw-gateway.svc
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:2380"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://$(MY_POD_NAME).apisix-etcd-headless.mw-gateway.svc:2379"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://$(MY_POD_NAME).apisix-etcd-headless.mw-gateway.svc:2380"
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: apisix-etcd
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_INITIAL_CLUSTER
              value: "apisix-etcd-0=http://apisix-etcd-0.apisix-etcd-headless.mw-gateway.svc:2380,apisix-etcd-1=http://apisix-etcd-1.apisix-etcd-headless.mw-gateway.svc:2380,apisix-etcd-2=http://apisix-etcd-2.apisix-etcd-headless.mw-gateway.svc:2380"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"        # 8G (04§3.9)
            # Auth is ON — a passwordless etcd holding the whole gateway route
            # table is a takeover target. The root password comes from the
            # apisix-etcd-credentials Secret; the data-plane config
            # (config/config.yaml) authenticates with the same credentials.
            - name: ALLOW_NONE_AUTHENTICATION
              value: "no"
            - name: ETCD_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apisix-etcd-credentials
                  key: root-password
          ports:
            - containerPort: 2379
              name: client
            - containerPort: 2380
              name: peer
          volumeMounts:
            - name: data
              mountPath: /bitnami/etcd
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-rbd-ssd
        resources:
          requests:
            storage: 50Gi                # 04§3.9
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix-etcd
  namespace: mw-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apisix-etcd
---
# Headless Service backing the apisix-etcd StatefulSet (serviceName above).
# Without it the per-pod DNS names referenced from config/config.yaml
# (apisix-etcd-{0,1,2}.apisix-etcd-headless.mw-gateway.svc) do not resolve.
apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd-headless
  namespace: mw-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # peers must resolve during bootstrap
  selector:
    app.kubernetes.io/name: apisix-etcd
  ports:
    - port: 2379
      name: client
    - port: 2380
      name: peer
