global_rules:
  - id: console-global
    plugins:
      real-ip:
        source: http_x_forwarded_for
        trusted_addresses: ["10.0.0.0/8"]
      request-id:
        header_name: X-Request-Id
        include_in_response: true
      prometheus:
        prefer_name: true
      http-logger:
        uri: http://vector.observability.svc:8080/apisix
        batch_max_size: 1000
        inactive_timeout: 5
