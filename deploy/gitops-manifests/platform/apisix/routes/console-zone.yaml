  - id: console-quota
    name: console-resource-quota
    desc: Quota usage, read-only (svc-quota)
    hosts: [console.euler.emoera.com]
    # Tenants may only read their usage. occupy / commit / release are the
    # two-phase reservation svc-orchestrator drives service-to-service while
    # fulfilling an order (services/svc-orchestrator/cmd/server/quotaclient.go);
    # routing them let a tenant hold, commit or release quota outside any
    # order. (platform/frontend calls no /api/v1/quota path at present.)
    methods: [GET]
    uris:
      - /api/v1/quota/usage
    upstream:
      nodes:
        "svc-quota.euler-svc-quota.svc:9208": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in account (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        action: eures:ConsoleApi
        region: cn-north-1
      eu-audit:
