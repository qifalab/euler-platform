  # ---------------------------------------------------------------------------
  # Marketing site (www.*) — anonymous, read-only public data. The Nuxt site
  # (apps/site) fetches these during SSR and in the browser. Exact paths and
  # GET/HEAD only: nothing else of svc-catalog / svc-notify is exposed here.
  # ---------------------------------------------------------------------------
  - id: portal-catalog-public
    name: portal-catalog-public
    desc: Public product catalogue and categories for the marketing site (svc-catalog)
    hosts: [www.euler.emoera.com]
    methods: [GET, HEAD]
    uris:
      - /api/v1/catalog/products
      - /api/v1/catalog/categories
    upstream:
      nodes:
        "svc-catalog.euler-svc-catalog.svc:9207": 1
      type: roundrobin
      timeout: { connect: 2, send: 5, read: 5 }
    plugins:
      limit-count:
        count: 3600          # 60 req/s per client IP (04§3.2 官网开放区)
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
        rejected_msg: '{"Code":"Common.Throttling","Message":"too many requests"}'
      eu-auth:
        mode: anonymous

  - id: portal-announcements-public
    name: portal-announcements-public
    desc: Public announcements board for the marketing site (svc-notify)
    hosts: [www.euler.emoera.com]
    methods: [GET, HEAD]
