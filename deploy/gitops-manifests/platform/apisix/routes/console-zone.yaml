      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        action: eutrade:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  - id: console-coupons
    name: console-trade-coupons
    desc: The account's coupons — list and detail (svc-order)
    hosts: [console.euler.emoera.com, billing.euler.emoera.com]
    # svc-order serves coupons read-only (GET /api/v1/coupons and
    # /api/v1/coupons/{couponId}); no other method is routed.
    methods: [GET]
    uris:
      - /api/v1/coupons
      - /api/v1/coupons/*
    upstream:
      nodes:
        "svc-order.euler-svc-order.svc:9204": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in account (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        action: eutrade:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  - id: console-payment
    name: console-trade-payment
    desc: Tenant-facing payment routes only — balance, recharge (channel-signed), freeze, consume
    hosts: [console.euler.emoera.com]
    uris:
      - /api/v1/payment/*
    upstream:
      # /api/v1/payment/* only. /internal/payment/{consume,refund} are
      # svc-order's service-to-service debit/refund and are never routed.
      nodes:
        "svc-payment.euler-svc-payment.svc:9205": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in account (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
