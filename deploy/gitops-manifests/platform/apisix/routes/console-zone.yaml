# APISIX route definitions — console zone (console.euler.emoera.com)
#
# Source of truth: 04-middleware-infrastructure.md §3.2/§3.3, 02-frontend §5.
#
# Auth differs from the OpenAPI zone: the console is a browser client, so it
# carries a JWT rather than a CPS1 signature. Token parameters are fixed by
# adjudication S13 (which overturned 07§2.4's original 12h/Strict scheme):
#
#   access_token   RS256 JWT, 15 min, held in memory only (never localStorage)
#   refresh_token  opaque, 7 days, rotating — old revoked on each refresh
#   cookie         HttpOnly; Secure; SameSite=Lax; Domain=.euler.emoera.com
#
# SameSite=Lax rather than Strict is deliberate: Strict blocks the cross-subdomain
# SSO flow between account.euler.emoera.com and console.euler.emoera.com. The refresh
# cookie is scoped to Path=/api/auth so it is not sent on ordinary API calls.
#
# The JWT is issued by svc-iam in the account domain; the gateway verifies with
# the public key published through Nacos, rotated by kid (04§3.4).
#
# Hosts: console.euler.emoera.com, plus account.euler.emoera.com for the svc-iam
# routes — web-account is also served standalone there (the SSO-only auth
# domain, 02-frontend-architecture) and calls the same relative /api/auth|account|ram|ak|mfa|
# realname|sts paths. billing.euler.emoera.com (web-billing) and
# ticket.euler.emoera.com (web-ticket) are the standalone forms of those two
# sub-apps: they get the routes their views call plus session refresh.
# www.euler.emoera.com (marketing site) only gets the anonymous, GET-only
# public catalogue / announcement routes at the end of this file.
#
# Upstreams are the in-cluster Services the ApplicationSet deploys:
# http://<app>.euler-<app>.svc:<service.port of apps/<app>/values.yaml>.
# /internal/* paths are service-to-service only and are never routed.
# eu-authorize always calls svc-iam web-auth CheckAccess:
#   http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
#
# eu-audit ships to Kafka's SASL_SSL client listener (:9092,
# platform/middleware/kafka-kraft.yaml): TLS verified against the platform CA
# (the plugin's ssl / ssl_verify default to true) and SCRAM-SHA-512 as user
# apisix-audit, whose password the gateway pods read from Secret
# kafka-apisix-audit. All three brokers are listed so the metadata bootstrap
# survives one broker (one AZ) down.

routes:
  # ---------------------------------------------------------------------------
  # Auth endpoints — deliberately NOT behind eu-auth (they mint the session).
  # ---------------------------------------------------------------------------
  - id: console-auth
    name: console-account-auth
    desc: Login, register, MFA login step, password reset. Rate limited hard; no auth plugin by design.
    hosts: [console.euler.emoera.com, account.euler.emoera.com]
    # Catch-all for the credential endpoints. refresh/session/logout are
    # matched first by the exact-path route console-auth-session below.
    uris:
      - /api/auth/*
    upstream:
      # Real cluster Service: the auth endpoints are served by svc-iam's
      # web-auth server (services/svc-iam/cmd/web-auth, listens :9101),
      # deployed by the ApplicationSet into namespace euler-svc-iam.
      nodes:
        "svc-iam.euler-svc-iam.svc:9101": 1
      type: roundrobin
      timeout: { connect: 2, send: 5, read: 5 }
    plugins:
      # Login is the credential-stuffing target: 5 attempts per minute per IP
      # (04§3.2 console zone baseline). The account-level 5-failure lockout is
      # enforced in svc-iam (07§2.4); this is the network-level floor.
      limit-count:
        count: 5
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
        rejected_msg: '{"Code":"Common.Throttling","Message":"too many attempts"}'
      # CSRF floor for the refresh endpoint: the browser client sets a custom
      # header, which a cross-site form post cannot forge (02§5.1).
      request-validation:
        header_schema:
          type: object
          required: ["x-requested-with"]
          properties:
            x-requested-with:
              type: string
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  # Session maintenance — refresh / session / logout. Split from console-auth:
  # the 5/min/IP credential-stuffing floor there also throttled the silent
  # refresh every open console tab performs (and the session fetch on each
  # shell boot), logging users out behind a shared NAT. These endpoints mint
  # nothing from a password, so they get a per-IP floor sized for NATed
  # offices instead. Exact paths win over the /api/auth/* prefix.
  - id: console-auth-session
    name: console-account-auth-session
    desc: Silent refresh, session snapshot, logout. No auth plugin by design (refresh is cookie-authenticated by svc-iam).
    hosts: [console.euler.emoera.com, account.euler.emoera.com, billing.euler.emoera.com, ticket.euler.emoera.com]
    uris:
      - /api/auth/refresh
      - /api/auth/session
      - /api/auth/logout
    priority: 10
    upstream:
      nodes:
        "svc-iam.euler-svc-iam.svc:9101": 1
      type: roundrobin
      timeout: { connect: 2, send: 5, read: 5 }
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
        rejected_msg: '{"Code":"Common.Throttling","Message":"too many requests"}'
      # Same CSRF floor as console-auth: refresh/logout ride the HttpOnly
      # refresh cookie, so a cross-site form post must not reach them.
      request-validation:
        header_schema:
          type: object
          required: ["x-requested-with"]
          properties:
            x-requested-with:
              type: string
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  # ---------------------------------------------------------------------------
  # Account / RAM / AK management
  # ---------------------------------------------------------------------------
  - id: console-account
    name: console-account-manage
    hosts: [console.euler.emoera.com, account.euler.emoera.com]
    # Every logged-in svc-iam web-auth path (services/svc-iam/cmd/web-auth):
    # profile/password, RAM users/roles/policies/simulate, AccessKeys, MFA
    # bind/verify/unbind, real-name, STS AssumeRole.
    uris:
      - /api/account/*
      - /api/ram/*
      - /api/ak
      - /api/ak/*
      - /api/mfa/*
      - /api/realname/*
      - /api/sts/*
    upstream:
      # Real cluster Service (namespace from the ApplicationSet: euler-svc-iam).
      nodes:
        "svc-iam.euler-svc-iam.svc:9101": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in user (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        # Public key is injected from Nacos config; rotation by kid.
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        # svc-iam's console endpoints are plain REST (no RPC-style Action
        # query parameter), so the action is pinned like console-trade:
        # action_from_query rejected every call with "missing or malformed
        # Action" (400) before it reached svc-iam.
        action: euiam:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  # ---------------------------------------------------------------------------
  # Trade: orders, billing, fee centre — aggregated by console-bff
  # ---------------------------------------------------------------------------
  - id: console-trade
    name: console-trade-orders
    hosts: [console.euler.emoera.com, billing.euler.emoera.com]
    # console-bff serves /console/* and the BFF-backed console views call
    # exactly these paths. The route previously declared /api/trade/* with no
    # rewrite, so every request reached the BFF as /api/trade/... — a path it
    # does not register (404), while /console/* itself had no route at all.
    uris:
      - /console/*
    upstream:
      # Real cluster Service (console-bff listens :9200; namespace from the
      # ApplicationSet: euler-console-bff).
      nodes:
        "console-bff.euler-console-bff.svc:9200": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        # The BFF's endpoints are plain REST (no RPC-style Action query
        # parameter), so the action is pinned per route: action_from_query
        # would resolve to nil and reject every call with
        # "missing or malformed Action" (400) before it reached the BFF.
        action: eutrade:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  # ---------------------------------------------------------------------------
  # Resource list / lifecycle — aggregated by console-bff
  # ---------------------------------------------------------------------------
  - id: console-resource
    name: console-resource-list
    hosts: [console.euler.emoera.com, billing.euler.emoera.com]
    # Same contract as console-trade: the BFF serves /console/resources, and
    # that is the path the console views call. (/api/resource/* was declared
    # here but is not a path any service registers.)
    uris:
      - /console/resources
      - /console/search
      - /console/overview
      - /console/bills
    upstream:
      # Real cluster Service (console-bff listens :9200; namespace from the
      # ApplicationSet: euler-console-bff).
      nodes:
        "console-bff.euler-console-bff.svc:9200": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        # Fixed action, like console-trade: the BFF is plain REST.
        action: eures:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  # ---------------------------------------------------------------------------
  # Service-owned console APIs: /api/v1/<svc>/** straight to the owning Service
  # (the paths the console shell and sub-apps call; the vite dev proxies in
  # platform/frontend/apps/*/vite.config.ts mirror this table). Plain REST, so
  # eu-authorize pins one action per domain, like console-trade.
  #
  # (The former console-product-euecs route — /api/euecs/* to console-bff —
  # was removed: console-bff registers no such path, and the ECS console calls
  # /console/*, /api/v1/orchestrator, /api/v1/catalog and /api/v1/orders,
  # all routed here.)
  # ---------------------------------------------------------------------------
  - id: console-catalog
    name: console-trade-catalog
    desc: Catalog — products, SKUs, quote, regions, images, placement (svc-catalog)
    hosts: [console.euler.emoera.com, billing.euler.emoera.com, ticket.euler.emoera.com]
    uris:
      - /api/v1/catalog/*
    upstream:
      nodes:
        "svc-catalog.euler-svc-catalog.svc:9207": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in account (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
        mode: jwt
        jwt_public_key_file: /opt/eu-secrets/jwt/publicKey
      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        action: eutrade:ConsoleApi
        region: cn-north-1
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-1.kafka-headless.mw-mq.svc, port: 9092 }, { host: kafka-2.kafka-headless.mw-mq.svc, port: 9092 }]
        sasl: { user: apisix-audit }

  - id: console-orders
    name: console-trade-orders-direct
    desc: Orders, auto-renew and free trial (svc-order)
    hosts: [console.euler.emoera.com, billing.euler.emoera.com]
    uris:
      - /api/v1/orders
      - /api/v1/orders/*
      - /api/v1/trial/*
    upstream:
      nodes:
        "svc-order.euler-svc-order.svc:9204": 1
      type: roundrobin
    plugins:
      limit-count:
        count: 1800          # 30 req/s per logged-in account (04§3.2)
        time_window: 60
        key_type: var
        key: http_x_euler_account_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
      eu-auth:
