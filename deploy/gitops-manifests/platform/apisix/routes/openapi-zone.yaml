# Global rules applied to every route in this zone (04§3.1).
global_rules:
  - id: openapi-global
    plugins:
      real-ip:
        source: http_x_forwarded_for
        trusted_addresses: ["10.0.0.0/8"]
      request-id:
        # trace_id is generated here and propagated full-chain, aligned with
        # OTel (04§3.1). Every log line and audit event carries it.
        header_name: X-Request-Id
        include_in_response: true
      prometheus:
        prefer_name: true
      http-logger:
        # Gateway access log → Kafka cloud.sys.audit.access (04§5.4).
        uri: http://vector.observability.svc:8080/apisix
        batch_max_size: 1000
        inactive_timeout: 5
