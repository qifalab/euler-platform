# APISIX route definitions — OpenAPI zone ({productCode}.api.euler.emoera.com)
#
# Source of truth: 04-middleware-infrastructure.md §3.2/§3.3 (domain form and
# route table), §3.5 (rate limiting), §3.7 (Nacos discovery); 07-security.md §5
# (plugin chain order).
#
# Domain form is locked (04§3.2, adjudication S6):
#   one product = one subdomain {productCode}.api.euler.emoera.com
#   RPC-style Action + date-type Version parameter
#   the URI does NOT carry a version (no /v1/ prefix)
#
# Plugin chain order (07§5) — the order is load-bearing, each stage is cheaper
# than the next so failing fast also sheds load under attack:
#   ip-restriction → limit-req → eu-auth → eu-authorize → eu-audit → upstream
#
# Managed via ADC CLI + GitOps; there is no APISIX Dashboard in any environment
# (04§3.9). Changes go through MR review like any other manifest.

routes:
  # ---------------------------------------------------------------------------
  # EUECS — 辰云服务器 (云服务器 VM)
  # ---------------------------------------------------------------------------
  - id: openapi-euecs
    name: openapi-compute-euecs          # {zone}-{domain}-{name} (04§3.3)
    desc: EUECS OpenAPI entry; RPC Action + date Version
    hosts:
      - euecs.api.euler.emoera.com
    uris:
      - /*
    methods: [GET, POST]
    # Nacos discovery: the subscription string must be {GROUP}@@{serviceName}
    # and match the registration side exactly, or discovery silently returns no
    # upstreams (selection pit #2). Group == service name (04§4.3).
    upstream:
      # PLANNED service: no svc-sc* OpenAPI facade exists under services/ yet;
      # Nacos discovery returns no upstream until the product service ships.
      service_name: svc-euecs@@svc-euecs
      discovery_type: nacos
      type: roundrobin
      timeout:
        connect: 2
        send: 5
        read: 5
    plugins:
      ip-restriction:
        # Blacklist / region ban maintained centrally; empty here means the
        # global rule applies.
        blacklist: []

      limit-req:
        # Leaky bucket, avalanche floor for the whole zone.
        rate: 200
        burst: 100
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: '{"Code":"Common.Throttling","Message":"request throttled"}'

      eu-auth:
        mode: signature
        verify_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/openapi/verify
        # region/service are bound to the ROUTE. They participate in the
        # derived signing key, so a signature scoped to euecs cannot be
        # replayed against euoss (07§4.1).
        region: cn-north-1
        service: ecs
        timeout_ms: 500

      eu-authorize:
        check_access_endpoint: http://svc-iam.euler-svc-iam.svc:9101/internal/authz/check
        # Action is multiplexed via the RPC-style Action parameter. The prefix
        # is pinned to this product so a caller cannot name another product's
        # action (04§3.2).
        action_from_query: Action
        action_prefix: euecs
        region: cn-north-1
        timeout_ms: 500

      # Per-AK quota. The threshold rides in from the verify endpoint as
      # X-Euler-Quota-Qps; the default here is the package floor (04§3.5).
      limit-count:
        count: 1200
        time_window: 60
        key_type: var
        key: http_x_eu_ak_id
        policy: redis-cluster
        redis_cluster_nodes:
          - redis-shard-0-headless.mw-cache.svc:6379
          - redis-shard-1-headless.mw-cache.svc:6379
          - redis-shard-2-headless.mw-cache.svc:6379
        redis_cluster_name: eu-redis-cluster
        rejected_code: 429
        rejected_msg: '{"Code":"Common.Throttling","Message":"AK quota exceeded"}'

      eu-audit:
        topic: cloud.sys.audit.action
        brokers:
          - host: kafka-0.kafka-headless.mw-mq.svc
            port: 9092
          - host: kafka-1.kafka-headless.mw-mq.svc
            port: 9092
          - host: kafka-2.kafka-headless.mw-mq.svc
            port: 9092

  # ---------------------------------------------------------------------------
  # EUOSS — 辰云对象存储
  #
  # Special case: the S3-compatible data plane is exempt from the RPC Action +
  # Version form (04§3.2) and passes through to the MinIO sell cluster with the
  # Host header preserved (virtual-host style addressing). Only the management
  # operations go through the standard control-plane chain.
  # ---------------------------------------------------------------------------
  - id: openapi-euoss-control
    name: openapi-storage-euoss-control
    desc: EUOSS management operations (bucket CRUD, lifecycle rules, quota)
    hosts:
      - euoss.api.euler.emoera.com
    uris:
      - /
    methods: [GET, POST]
    # Only requests carrying an Action parameter are control-plane calls;
    # everything else is S3 data-plane traffic handled by the route below.
    vars:
      - ["arg_Action", "~~", ".+"]
    upstream:
      # PLANNED service: no svc-sc* OpenAPI facade exists under services/ yet;
      # Nacos discovery returns no upstream until the product service ships.
      service_name: svc-euoss@@svc-euoss
      discovery_type: nacos
      type: roundrobin
      timeout: { connect: 2, send: 5, read: 5 }
    plugins:
      limit-req:
        rate: 200
        burst: 100
        key_type: var
        key: remote_addr
        rejected_code: 429
      eu-auth:
        mode: signature
        region: cn-north-1
        service: oss
      eu-authorize:
        action_from_query: Action
        action_prefix: euoss
        region: cn-north-1
      limit-count:
        count: 1200
        time_window: 60
        key_type: var
        key: http_x_eu_ak_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
      eu-audit:
        brokers:
          - { host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }

  - id: openapi-euoss-data
    name: openapi-storage-euoss-data
    desc: >
      EUOSS S3-compatible data plane. Passes through to the MinIO sell cluster
      with the Host header preserved. Signature verification is MinIO's own
      SigV4 (S3 ecosystem compatibility, 04§9.4) — NOT CPS1 — so eu-auth does
      not run here. This is the one documented exemption from the platform
      signature contract (04§3.2).
    hosts:
      - euoss.api.euler.emoera.com
    uris:
      - /*
    upstream:
      # Direct to the MinIO sell cluster; not a Nacos-registered service.
      nodes:
        "minio-sell.mw-data.svc:9000": 1
      type: roundrobin
      pass_host: pass      # preserve the Host header for virtual-host style
    plugins:
      limit-req:
        rate: 2000         # data plane carries far higher volume
        burst: 1000
        key_type: var
        key: remote_addr
        rejected_code: 429

  # ---------------------------------------------------------------------------
  # EURDS / EUVPC / EUBS / EUEIP / EUMON
  #
  # Same shape as EUECS; each product gets its own subdomain, its own Nacos
  # service, and an action_prefix pinned to its product code. Adding a product
  # is filling this template (01§7.3 "填槽" onboarding checklist step 5).
  # ---------------------------------------------------------------------------
  - id: openapi-eurds
    name: openapi-database-eurds
    hosts: [eurds.api.euler.emoera.com]
    uris: [/*]
    upstream:
      # PLANNED service: no svc-sc* OpenAPI facade exists under services/ yet;
      # Nacos discovery returns no upstream until the product service ships.
      service_name: svc-eurds@@svc-eurds
      discovery_type: nacos
      type: roundrobin
    plugins:
      limit-req: { rate: 200, burst: 100, key_type: var, key: remote_addr, rejected_code: 429 }
      eu-auth: { mode: signature, region: cn-north-1, service: rds }
      eu-authorize: { action_from_query: Action, action_prefix: eurds, region: cn-north-1 }
      limit-count:
        count: 1200
        time_window: 60
        key_type: var
        key: http_x_eu_ak_id
        policy: redis-cluster
        redis_cluster_nodes: ["redis-shard-0-headless.mw-cache.svc:6379", "redis-shard-1-headless.mw-cache.svc:6379", "redis-shard-2-headless.mw-cache.svc:6379"]
        redis_cluster_name: eu-redis-cluster
      eu-audit:
        brokers: [{ host: kafka-0.kafka-headless.mw-mq.svc, port: 9092 }]

  - id: openapi-euvpc
    name: openapi-network-euvpc
    hosts: [euvpc.api.euler.emoera.com]
    uris: [/*]
    upstream:
