# APISIX config.yaml — data plane
#
# Source of truth: 04-middleware-infrastructure.md §3.1 (three-zone split),
# §3.7 (Nacos discovery), §3.9 (deployment & HA), §10.1 (K8s form).
#
# Three independent data-plane clusters (官网开放区 / 控制台区 / OpenAPI 区)
# share a single 3-node etcd. etcd is split off with the cluster only when
# OpenAPI-zone QPS exceeds 20k or compliance demands strong isolation
# (04§3.1). etcd is a gateway single point of failure if unmanaged, so it is on
# the middleware ops checklist — backup, monitoring, version upgrades
# (selection pit #3).

apisix:
  node_listen: 9080
  # Custom plugins (eu-auth / eu-authorize / eu-audit). APISIX loads a plugin
  # with require("apisix.plugins.<name>"), so with this search path the module
  # must live at /opt/eu-plugins/apisix/plugins/<name>.lua — that is where
  # platform/apisix/apisix-deployment.yaml mounts the apisix-eu-plugins
  # ConfigMap. (extra_lua_path is an apisix.* key; at the top level of this
  # file it is ignored and the plugins never load.)
  extra_lua_path: "/opt/eu-plugins/?.lua"
  enable_admin: false          # Admin API only on the control-plane instances
  # Status API (GET /status liveness, GET /status/ready readiness — 503 until
  # every worker has loaded config from etcd). It is the kubelet probe target
  # in apisix-deployment.yaml; /apisix/status on 9080 only exists when the
  # node-status plugin is exposed through public-api, which it is not.
  status:
    ip: "0.0.0.0"
    port: 7085
  # No Dashboard in any environment: changes go through ADC CLI + GitOps MR
  # review (04§3.9), so the cluster state always matches Git.
  enable_control: true
  control:
    ip: "127.0.0.1"
    port: 9090
  proxy_cache:
    cache_ttl: 10s
    zones:
      - name: disk_cache_one
        memory_size: 50m
        disk_size: 1G
        disk_path: /tmp/disk_cache_one
        cache_levels: "1:2"
  # Trust store for the gateway's outbound TLS: the platform CA from
  # cert-manager (platform/middleware/tls.yaml), mounted by
  # apisix-deployment.yaml. APISIX renders it as lua_ssl_trusted_certificate
  # (eu-audit verifies the Kafka brokers against it) and
  # proxy_ssl_trusted_certificate (https upstreams, see nginx_config). It is
  # the ONLY trusted CA — a public-CA upstream would fail verification — and
  # APISIX refuses to start when the file is missing.
  ssl:
    ssl_trusted_certificate: /opt/eu-secrets/platform-ca/ca.crt

deployment:
  role: data_plane
  role_data_plane:
    config_provider: etcd
  etcd:
    host:
      - "http://apisix-etcd-0.apisix-etcd-headless.mw-gateway.svc:2379"
      - "http://apisix-etcd-1.apisix-etcd-headless.mw-gateway.svc:2379"
      - "http://apisix-etcd-2.apisix-etcd-headless.mw-gateway.svc:2379"
    prefix: /apisix
    timeout: 30
    # etcd runs with auth enabled (ALLOW_NONE_AUTHENTICATION=no in
    # apisix-deployment.yaml); credentials come from the apisix-etcd-credentials
    # Secret, injected as the APISIX_ETCD_PASSWORD env var. ${{VAR}} is the
    # APISIX config.yaml environment-variable reference syntax.
    user: root
    password: ${{APISIX_ETCD_PASSWORD}}

# Nacos service discovery.
#
# Compatibility (selection pit #2): the discovery plugin speaks the Nacos 1.x
# HTTP Open API. Nacos is pinned to 2.4.x LTS with auth enabled and a read-only
# apisix_ro account. Before any upgrade to Nacos 3.x, discovery compatibility
# must be verified in staging first.
#
# The subscription string is {GROUP}@@{serviceName} and must match the
# registration side exactly — Group equals the application name (04§4.3). A
# mismatch fails silently: discovery simply returns no upstreams.
#
# The prod gateway subscribes to the prod namespace only (04§4.3 订阅边界).
discovery:
  nacos:
    host:
      - "http://nacos-headless.mw-core.svc:8848"
    prefix: "/nacos/v1/"
    fetch_interval: 30
    weight: 100
    timeout:
      connect: 2000
      send: 2000
      read: 5000
    # Credentials come from a K8s Secret, never inline (04§4.2). ${{VAR}} is
    # the APISIX config.yaml env-reference syntax (plain ${VAR} is NOT
    # interpolated by APISIX).
    username: apisix_ro
    password: ${{NACOS_APISIX_PASSWORD}}

nginx_config:
  worker_processes: auto
  error_log_level: warn
  # Environment variables the Lua workers may read (nginx drops all others).
  # EULER_INTERNAL_TOKEN is injected upstream by eu-auth after authentication.
  envs:
    - EULER_INTERNAL_TOKEN
    # SCRAM password of eu-audit's Kafka user (plugins/eu-audit.lua).
    - EULER_KAFKA_SASL_PASSWORD
  # Verify the certificate of every https upstream (APISIX 3.9 honours
  # upstream.tls.verify for kafka upstreams only). The name checked is
  # $upstream_host (proxy_ssl_name; nginx_config.http.proxy_ssl_server_name is
  # on by default), so a pass_host: pass route is verified against the
  # client's Host — the MinIO sell certificate (minio-sell-tls) carries
  # euoss.api.euler.emoera.com for the openapi-euoss-data route.
  http_server_location_configuration_snippet: |
    proxy_ssl_verify on;
  http:
    lua_shared_dict:
      # eu-authorize L1 decision cache (07§3.5, 30s TTL).
      eu_authz_cache: 64m
      # Standard APISIX dictionaries.
      prometheus-metrics: 20m

plugins:
  # This list REPLACES APISIX's default plugin set: a plugin that is not
  # listed here cannot be used by any route (the route is rejected), so every
  # plugin referenced from routes/*.yaml must appear below.
  # Order here does not set execution order — that comes from each plugin's
  # priority field. Listed in chain order for readability (07§5):
  #   ip-restriction → limit-req → eu-auth → eu-authorize → eu-audit → upstream
  - real-ip
  - request-id
  - ip-restriction
  - uri-blocker          # blocks MinIO's admin/metrics paths on the S3 data plane
  - limit-req
  - limit-count
  - eu-auth              # custom: CPS1 signature / JWT authentication
  - eu-authorize         # custom: action-level authorization via svc-iam
  - eu-audit             # custom: audit side-stream to Kafka
  - request-validation
  - proxy-rewrite
  - traffic-split        # canary by weight (04§3.6)
  - prometheus
  - http-logger
  - api-breaker          # passive circuit breaking (04§3.5)

plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 0.0.0.0
      port: 9091          # scraped by Prometheus (05§7.2)
