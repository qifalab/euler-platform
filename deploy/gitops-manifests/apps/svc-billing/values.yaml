# Default values for the svc-billing chart.
# Env-specific overrides live in deploy/gitops-manifests/envs/<env>/values-overrides/.

image:
  repository: harbor.internal/cloudplatform/svc-billing
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: svc-billing

service:
  port: 8080
  targetPort: 8080

# Runtime env shared by all phase-1 services (04§3.4, 08§6.2).
env:
  NACOS_NAMESPACE: "public"
  SERVICE_GROUP: "cloudplatform"

# Probe endpoints (all-Go services expose /healthz /readyz).
probe:
  readinessPath: /healthz
  livenessPath: /healthz

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: "1Gi"

# Cross-AZ topology (M-6, 00§4.4 P2). Default off (P1 single-AZ dev); prod
# and staging overrides turn zoneSpread on so replicas hard-spread across AZs.
topology:
  zoneSpread: false                  # set true in prod/staging values-overrides
  maxSkew: 1                         # the smallest skew a P2 service tolerates
  whenUnsatisfiable: DoNotSchedule   # hard, not ScheduleAnyway (P2 is a promise)
