# ServiceAccount + Service + PodDisruptionBudget for this app chart.
#
# All three objects are driven entirely by values.yaml and are identical across
# every app chart; they live in this one file so the chart's plumbing travels as
# a unit (env: configmap.yaml, workload: deployment.yaml).

# --- ServiceAccount --------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
---

# --- Service ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
---

# --- PodDisruptionBudget ---------------------------------------------------
# PodDisruptionBudget (M-6, 00§4.4 P2): with >1 replica, at least one pod
# must survive voluntary disruption (drain/upgrade). Not rendered for a
# single replica — minAvailable 1 there would block every node drain.
{{- if and .Values.pdb.enabled (gt (int .Values.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
{{- end }}
