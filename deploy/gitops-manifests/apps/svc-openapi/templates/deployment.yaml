apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Business services sync at wave 10, after middleware (-5) and gateway (0)
    # (08§4.3).
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Roll pods when the projected env ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # Least privilege (等保三级 / CIS): non-root, no privilege escalation,
      # read-only root filesystem, all capabilities dropped, default seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Business workloads land on the general services pool (04§2.1); the
      # gateway pool is tainted and reserved for gateway/middleware.
      nodeSelector:
        cloud.platform/pool: services
      # Spread replicas across nodes so a node loss cannot take the service
      # down entirely.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
        # Zone-level spread (M-6, 00§4.4 P2): in prod/staging the env override
        # sets .Values.topology.zoneSpread to true, adding a hard constraint
        # that replicas also spread across AZs (maxSkew:1, DoNotSchedule). A
        # stateless service concentrated in one AZ is the exact failure the P2
        # contract forbids — losing that AZ should not take the service down.
        # The policy is defined once in pkg-go/topology.FaultDomainSpread.
        {{- if .Values.topology.zoneSpread }}
        - maxSkew: {{ .Values.topology.maxSkew | default 1 }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topology.whenUnsatisfiable | default "DoNotSchedule" }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          # Listen address injected via CLI args — the Go services take the
          # port from the -http flag, so the chart is the single source of
          # truth for containerPort / Service port / probe port / listen port.
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          # All runtime env comes from the <release>-config ConfigMap
          # (configmap.yaml) so the operator-visible config and the container
          # env can never drift apart.
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            # Secrets (EULER_INTERNAL_TOKEN, signing/KMS keys, DSN, ...) from one
            # Secret per namespace — README「生产必需配置」. Optional so dev
            # clusters start without it; production services refuse to start
            # when a required secret is missing (pkg-go/runmode).
            - secretRef:
                name: {{ .Values.secretName | default "euler-platform-secrets" }}
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.readinessPath }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.livenessPath }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          lifecycle:
            preStop:
              # Drain before exit: stop accepting new connections and let
              # in-flight requests finish (08§6.2). Native sleep action
              # (Kubernetes >= 1.30): the images are distroless, so an exec
              # of /bin/sh would fail and skip the drain entirely.
              sleep:
                seconds: 15
      terminationGracePeriodSeconds: 45
