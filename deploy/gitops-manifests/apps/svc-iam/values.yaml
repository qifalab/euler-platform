# Default values for the svc-iam chart.
# Env-specific overrides live in deploy/gitops-manifests/envs/<region>/<env>/values-overrides/.

image:
  repository: harbor.internal/cloudplatform/svc-iam
  # Immutable version tag (never `latest`): CI stamps the released tag via the
  # env values-overrides; v0.1.0 is the placeholder for the first cut.
  tag: v0.1.0
  pullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: svc-iam

# The pod runs two containers from the same image (every cmd/* binary is
# shipped as /app/<dir>; /app/app is web-auth):
#   web-auth  — /app/app, :9101 (Service port "http"): console/account auth,
#               RAM/AK management and the gateway CheckAccess endpoint
#               /internal/authz/check (eu-authorize).
#   verify    — /app/verify, :9100 (Service port "verify"): the OpenAPI CPS1
#               signature verifier /internal/openapi/verify (eu-auth).
service:
  port: 9101
  targetPort: 9101

# The service binaries take their listen address from the -http flag
# (services/svc-iam/cmd/*/main.go). The chart injects it so containerPort,
# Service port, probes and the actual listen port always agree.
args:
  - "-http=:9101"

# The verify container (see above). Same image, env, Secret and
# securityContext as web-auth; its own port, probes and resources.
verify:
  command: ["/app/verify"]
  port: 9100
  args:
    - "-http=:9100"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: "512Mi"

# Runtime env shared by all phase-1 services (04§3.4, 08§6.2), projected via
# the <release>-config ConfigMap and mounted with envFrom.
env:
  NACOS_NAMESPACE: "public"
  SERVICE_GROUP: "cloudplatform"

# Probe endpoints (all-Go services expose /healthz and /readyz).
probe:
  readinessPath: /readyz
  livenessPath: /healthz

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: "1Gi"

# Cross-AZ topology (M-6, 00§4.4 P2). Default off (P1 single-AZ dev); prod
# and staging overrides turn zoneSpread on so replicas hard-spread across AZs.
topology:
  zoneSpread: false                  # set true in prod/staging values-overrides
  maxSkew: 1                         # the smallest skew a P2 service tolerates
  whenUnsatisfiable: DoNotSchedule   # hard, not ScheduleAnyway (P2 is a promise)

# PodDisruptionBudget: rendered only when replicas > 1 (a single-replica dev
# deployment with minAvailable 1 would block every node drain).
pdb:
  enabled: true
  minAvailable: 1

# Least-privilege runtime (templates/deployment.yaml securityContext) and
# ingress isolation (templates/networkpolicy.yaml).
networkPolicy:
  enabled: true
  # Namespaces allowed in addition to those labelled euler.platform/plane=control.
  allowFromNamespaces:
    - mw-gateway
    - observability

# Secret projected with envFrom (optional); see README「生产必需配置」.
# web-auth in prod/staging refuses to start without EULER_DB_DSN,
# EULER_KMS_MASTER_KEY (shared with verify: console-created AccessKeys are
# sealed with it; EULER_KMS_MASTER_KEY_PREVIOUS during a rotation),
# EULER_IDENTITY_PEPPER and EULER_INTERNAL_TOKEN. Optional:
# EULER_REALNAME_PROVIDER_URL + EULER_REALNAME_PROVIDER_SECRET.
secretName: euler-platform-secrets

# Non-secret env projected into the ConfigMap (EULER_ENV is set per
# environment in envs/<region>/<env>/values-overrides).
extraEnv:
  # svc-notify, which mails the password-reset codes (POST
  # /internal/notifications); required in prod/staging.
  EULER_SVC_NOTIFY_URL: "http://svc-notify.euler-svc-notify.svc:8080"
