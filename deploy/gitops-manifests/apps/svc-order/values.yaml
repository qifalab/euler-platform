# Default values for the svc-order chart.
# Env-specific overrides live in deploy/gitops-manifests/envs/<region>/<env>/values-overrides/.

image:
  repository: harbor.internal/cloudplatform/svc-order
  # Immutable version tag (never `latest`): CI stamps the released tag via the
  # env values-overrides; v0.1.0 is the placeholder for the first cut.
  tag: v0.1.0
  pullPolicy: IfNotPresent

replicas: 1

serviceAccount:
  name: svc-order

service:
  port: 9204
  targetPort: 9204

# The service binary takes its listen address from the -http flag
# (services/svc-order/cmd/*/main.go). The chart injects it so containerPort,
# Service port, probes and the actual listen port always agree.
args:
  - "-http=:9204"

# Runtime env shared by all phase-1 services (04§3.4, 08§6.2), projected via
# the <release>-config ConfigMap and mounted with envFrom.
env:
  NACOS_NAMESPACE: "public"
  SERVICE_GROUP: "cloudplatform"

# Probe endpoints (all-Go services expose /healthz and /readyz).
probe:
  readinessPath: /readyz
  livenessPath: /healthz

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: "1Gi"

# Cross-AZ topology (M-6, 00§4.4 P2). Default off (P1 single-AZ dev); prod
# and staging overrides turn zoneSpread on so replicas hard-spread across AZs.
topology:
  zoneSpread: false                  # set true in prod/staging values-overrides
  maxSkew: 1                         # the smallest skew a P2 service tolerates
  whenUnsatisfiable: DoNotSchedule   # hard, not ScheduleAnyway (P2 is a promise)

# PodDisruptionBudget: rendered only when replicas > 1 (a single-replica dev
# deployment with minAvailable 1 would block every node drain).
pdb:
  enabled: true
  minAvailable: 1

# Least-privilege runtime (templates/deployment.yaml securityContext) and
# ingress isolation (templates/networkpolicy.yaml).
networkPolicy:
  enabled: true
  # Namespaces allowed in addition to those labelled euler.platform/plane=control.
  allowFromNamespaces:
    - mw-gateway
    - observability

# Secret projected with envFrom (optional); see README「生产必需配置」.
secretName: euler-platform-secrets

# Non-secret env projected into the ConfigMap (EULER_ENV is set per
# environment in envs/<region>/<env>/values-overrides).
extraEnv:
  EULER_SVC_CATALOG_URL: "http://svc-catalog.euler-svc-catalog.svc:9207"
  EULER_SVC_PAYMENT_URL: "http://svc-payment.euler-svc-payment.svc:9205"
  # 实名 status for trial admission (GET /internal/accounts/{id}/realname);
  # required when EULER_ENV is production-class.
  EULER_SVC_IAM_URL: "http://svc-iam.euler-svc-iam.svc:9101"
