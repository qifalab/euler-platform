syntax = "proto3";

package euler.apimeta.v1;

option go_package = "github.com/qifalab/euler-platform/proto/euler/apimeta/v1;apimetav1";

// ApiMetaService is the OpenAPI metadata center (03§4.5.1 / 03§9.4).
//
// Owns the authoritative registry of every product's OpenAPI surface: each
// Action's parameter schema, error codes, and version. It drives three things
// so the three cannot drift (03§9.4 rule ⑤ — single contract owner):
//   1. documentation generation (文档中心, 01-product-catalog.md);
//   2. SDK generation (Go/Python, 03§9.4);
//   3. OpenAPI Explorer debug-console backend.
//
// The gateway refuses to mount a route for an Action that is not registered
// here, so this registry is a real gate — a product cannot ship an
// undocumented/undefinable API (决策 D2 三件套: resource type + metering item
// + OpenAPI schema, the third leg).
service ApiMetaService {
  // RegisterAction upserts the parameter schema and error codes for one
  // product Action. Emits cloud.sys.apimeta.action.changed to invalidate
  // doc/SDK caches.
  rpc RegisterAction(RegisterActionRequest) returns (Action);

  // DescribeAction returns one Action's full schema.
  rpc DescribeAction(DescribeActionRequest) returns (Action);

  // ListActions lists Actions, optionally filtered by product.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);

  // GenerateDoc renders the documentation bundle for a product.
  rpc GenerateDoc(GenerateDocRequest) returns (Doc);
}

message Action {
  string action_id = 1;        // "{product}.{Action}", e.g. "euecs.StartInstance"
  string product_code = 2;     // e.g. "euecs"
  string action_name = 3;      // RPC-style Action, e.g. "StartInstance"
  string method = 4;           // "POST"
  string path = 5;             // "/"
  string param_schema_json = 6; // JSON Schema of request params
  string error_codes_json = 7;  // {"InvalidParameter": {...}, ...}
  int32 version = 8;           // semantic-ish, additive-only
  ActionStatus status = 9;
  int64 updated_at = 10;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_DRAFT = 1;
  ACTION_STATUS_RELEASED = 2;   // mounted on the gateway
  ACTION_STATUS_DEPRECATED = 3;
}

message Doc {
  string doc_id = 1;
  string product_code = 2;
  string content_md = 3;        // rendered doc bundle
  int32 version = 4;
  int64 generated_at = 5;
}

message RegisterActionRequest {
  string product_code = 1;
  string action_name = 2;
  string param_schema_json = 3;
  string error_codes_json = 4;
}

message DescribeActionRequest {
  string action_id = 1;
}

message ListActionsRequest {
  string product_code = 1;      // optional filter
  int32 page_number = 2;
  int32 page_size = 3;
}

message ListActionsResponse {
  repeated Action actions = 1;
  int32 total_count = 2;
}

message GenerateDocRequest {
  string product_code = 1;
  int32 version = 2;            // optional; latest if 0
}
