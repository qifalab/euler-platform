syntax = "proto3";

package euler.event.v1;

option go_package = "github.com/qifalab/euler-platform/proto/euler/event/v1;eventv1";

// Canonical event envelope (统一信封) for every cloud.* Kafka message
// (03§7 / 04§5.3). Every consumer MUST be idempotent; payload holds only IDs
// and state — consumers回查 full data as needed.
message Envelope {
  string event_id = 1;          // e.g. ev-20260804-000123
  string event_type = 2;        // e.g. "cloud.trade.order.paid"
  int64 occurred_at = 3;        // unix seconds, UTC
  string aggregate_id = 4;      // account_id | resource_id | order_id (the partition key)
  bytes payload = 5;            // marshaled domain message below; schema_version inside
  int32 schema_version = 6;     // additive-only evolution (no breaking field changes)
}

// --- Trade domain (svc-order / svc-payment) ---

message OrderEvent {
  int64 order_id = 1;
  int64 account_id = 2;
  OrderState state = 3;          // created|paid|fulfilling|completed|cancelled|refunded
  string product_code = 4;
  string charge_type = 5;       // prepaid | postpaid
  string client_token = 6;      // idempotency key
}

enum OrderState {
  ORDER_STATE_UNSPECIFIED = 0;
  ORDER_STATE_CREATED = 1;
  ORDER_STATE_PAID = 2;        // triggers svc-orchestrator provisioning
  ORDER_STATE_FULFILLING = 3;
  ORDER_STATE_COMPLETED = 4;
  ORDER_STATE_CANCELLED = 5;
  ORDER_STATE_REFUNDED = 6;
}

message PaymentEvent {
  int64 payment_id = 1;
  int64 order_id = 2;
  int64 account_id = 3;
  PaymentState state = 4;       // paid | refunded
  string channel = 5;
  int64 amount_cents = 6;       // money is integer cents; never float (03§6 约定)
}

enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  PAYMENT_STATE_PAID = 1;
  PAYMENT_STATE_REFUNDED = 2;
}

// --- Billing domain (svc-billing) ---

message BillingAccountEvent {
  int64 account_id = 1;
  BillingAccountState state = 2; // overdue | settled | frozen
  int64 balance_cents = 3;
}

enum BillingAccountState {
  BILLING_ACCOUNT_STATE_UNSPECIFIED = 0;
  BILLING_ACCOUNT_STATE_NORMAL = 1;
  BILLING_ACCOUNT_STATE_OVERDUE = 2;   // 宽限期中
  BILLING_ACCOUNT_STATE_FROZEN = 3;    // 停服锁定
}

// --- Resource domain (svc-orchestrator) ---

// The hottest topic. Every resource state transition emits this; the
// billing/metering/notification/audit/console-search all consume it. The state
// machine is the source of truth for L2 reconciliation timelines (05§5.5.2).
message ResourceLifecycleEvent {
  string resource_id = 1;       // euecs-cn-north-1-01-a1b2c3d4
  int64 account_id = 2;
  string product_code = 3;
  ResourceState state = 4;
  string charge_type = 5;
  int64 billing_start = 6;       // RUNNING moment — billing starts here (03§5.3)
  int64 expired_at = 7;          // prepaid expiry
  int64 locked_at = 8;
  int64 released_at = 9;
}

enum ResourceState {
  RESOURCE_STATE_UNSPECIFIED = 0;
  RESOURCE_STATE_INIT = 1;
  RESOURCE_STATE_CREATING = 2;
  RESOURCE_STATE_RUNNING = 3;
  RESOURCE_STATE_STOPPED = 4;
  RESOURCE_STATE_UPGRADING = 5;
  RESOURCE_STATE_LOCKED = 6;       // 欠费停服锁定, data retained
  RESOURCE_STATE_EXPIRED = 7;      // prepaid 到期
  RESOURCE_STATE_RELEASING = 8;
  RESOURCE_STATE_RELEASED = 9;
  RESOURCE_STATE_CREATE_FAILED = 10;
}

// --- Metering domain (rc-* → svc-metering → svc-billing) ---

// Raw usage point pushed by a product controller / host agent, keyed by
// resource_id. 64 partitions, 3-day retention. Idempotency key is the
// deterministic record_id = sha1(resource_id|item|window_start)[0:24] (05§5.5.1).
message UsageRecord {
  string record_id = 1;         // deterministic idempotency key
  int64 account_id = 2;
  string region = 3;
  string resource_type = 4;     // ecs | oss | rds | ...
  string resource_id = 5;
  string metering_item = 6;     // cpu_seconds | storage_gb_hour | ...
  string quantity = 7;          // decimal string; never float for money/units
  int64 window_start = 8;       // unix seconds, minute-aligned
  int32 window_seconds = 9;     // usually 60
  int64 collect_ts = 10;
  string collector_id = 11;
  string batch_id = 12;         // "rt" | "late"
  string trace_id = 13;
}

// Hourly aggregate produced by svc-metering, consumed by svc-billing for
// deduction. Idempotency key agg_id = sha1(resource_id|item|hour)[0:24].
message HourlyUsage {
  string agg_id = 1;
  int64 account_id = 2;
  string region = 3;
  string resource_type = 4;
  string resource_id = 5;
  string metering_item = 6;
  string total_quantity = 7;    // decimal string
  int64 hour_start = 8;         // on the hour, unix seconds
  int32 covered_ratio = 9;      // 0-100; <100 triggers backfill (05§5.5.2 L1)
  int64 produced_ts = 10;
  string batch_id = 11;
}

// --- Account domain (svc-iam) ---

message UserEvent {
  int64 account_id = 1;
  UserEventType event_type = 2;
  int64 occurred_at = 3;
}

enum UserEventType {
  USER_EVENT_TYPE_UNSPECIFIED = 0;
  USER_EVENT_TYPE_REGISTERED = 1;
  USER_EVENT_TYPE_REAL_NAME_INDIVIDUAL = 2;
  USER_EVENT_TYPE_REAL_NAME_ENTERPRISE = 3;
  USER_EVENT_TYPE_AK_CREATED = 4;
  USER_EVENT_TYPE_AK_DISABLED = 5;
  USER_EVENT_TYPE_AK_DELETED = 6;
  USER_EVENT_TYPE_PASSWORD_CHANGED = 7;
  USER_EVENT_TYPE_CANCELLATION = 8;
}

message UserLoginEvent {
  int64 account_id = 1;
  bool success = 2;
  string source_ip = 3;
  string user_agent = 4;
  bool abnormal = 5;            // anomaly detection hit (07§6.1)
  int64 occurred_at = 6;
}

// --- Platform channels ---

message AuthzPolicyChanged {
  int64 account_id = 1;
  int64 policy_version = 2;     // gateway & svc-iam invalidate L1/L2 on this
}

message AuditAction {
  string event_id = 1;
  int64 event_time = 2;
  string event_source = 3;      // e.g. euecs.api.euler.emoera.com
  string event_name = 4;       // e.g. StopInstance
  string source_ip = 5;
  string user_agent = 6;
  IdentitySnapshot identity = 7;
  repeated string resource = 8; // ARNs
  string decision = 9;          // allow | deny
  string request_params_json = 10;
  int32 response_code = 11;
  string trace_id = 12;
  string chain_hash = 13;       // tamper-proof tenant-dimension hash chain (07§6.2)
}

message IdentitySnapshot {
  string type = 1;              // "ram-user" | "root" | "role" (canonical spelling: ram-user)
  int64 account_id = 2;
  string principal = 3;
  string ak_id = 4;
  bool mfa_present = 5;
}

message NotifyMessage {
  int64 account_id = 1;
  string template_id = 2;
  map<string, string> params = 3;
  repeated string channels = 4; // in_app | sms | email | webhook
}

message WorkflowTask {
  int64 flow_instance_id = 1;
  string step_type = 2;         // executor subscribes to its task_type
  bytes payload = 3;
}
