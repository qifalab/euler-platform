syntax = "proto3";

package euler.workflow.v1;

option go_package = "github.com/qifalab/euler-platform/proto/euler/workflow/v1;workflowv1";

// WorkflowService is the platform-level lightweight workflow / state-machine
// engine (03§4.3.3). A SELF-BUILT lightweight implementation — no heavy
// workflow components from outside the candidate pool (explicitly NOT
// Temporal/Camunda) are introduced (03§4.3.3).
//
// Design (03§4.3.3):
//   - flow_definition (step JSON) / flow_instance / step_instance three tables;
//     steps are dispatched to executors via Kafka cloud.sys.workflow.task
//     (each business service subscribes to its own task_type, 03§7).
//   - Timers are implemented as "scan next_fire_at index + distributed lock",
//     not an extra scheduling component.
//   - Every step executes idempotently — the engine delivers at-least-once.
//
// Consumers: svc-orchestrator (primary, fulfill/renew/resize flows), svc-ticket
// (approval flows), svc-billing (催收/collection flows) (03§4.3.3).
service WorkflowService {
  // StartFlow starts a flow instance for the given definition and business
  // key, and dispatches the first ready step. Idempotent by biz_key: a
  // repeated start for the same definition+biz_key returns the existing
  // flow_instance_id (03§4.3.3).
  rpc StartFlow(StartFlowRequest) returns (StartFlowResponse);

  // CompleteStep is the executor callback: reports the result of a dispatched
  // step, then the engine advances the DAG (dispatching successors). Executors
  // must be idempotent; the engine tolerates at-least-once delivery (03§4.3.3).
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);

  // CompensateFlow runs the registered compensation operations in reverse
  // order (Saga, 03§8.4). Compensation is itself idempotent and retried
  // at-least-once; three failed compensation attempts escalate to a manual
  // work order via svc-ticket plus an alert (03§8.4).
  rpc CompensateFlow(CompensateFlowRequest) returns (CompensateFlowResponse);
}

// Ack is a generic success acknowledgment.
message Ack {}

// FlowInstance is a running instance of a flow definition (03§4.3.3). It
// carries the business key and current aggregate state; individual step state
// lives in StepInstance.
message FlowInstance {
  int64 flow_instance_id = 1;
  string def_key = 2;               // e.g. "fulfill-instance" / "resize-flow" / "renew-flow"
  string biz_key = 3;               // e.g. the order_no / resource_id; idempotency key
  bytes payload = 4;                // business payload echoed to each step
  FlowStatus status = 5;
  int64 created_at = 6;
  int64 completed_at = 7;
  int64 compensated_at = 8;
}

enum FlowStatus {
  FLOW_STATUS_UNSPECIFIED = 0;
  FLOW_STATUS_RUNNING = 1;
  FLOW_STATUS_COMPLETED = 2;
  FLOW_STATUS_COMPENSATING = 3;
  FLOW_STATUS_COMPENSATED = 4;
  FLOW_STATUS_FAILED = 5;           // compensation exhausted → manual escalation
}

// StepInstance is one executed step within a flow (03§4.3.3). Each step
// registers a forward operation and a compensation operation (03§8.4).
message StepInstance {
  int64 step_instance_id = 1;
  int64 flow_instance_id = 2;
  string step_type = 3;             // e.g. "occupy_quota" | "create_resource" | "start_metering"
  string task_type = 4;             // executor subscribes to this on cloud.sys.workflow.task
  bytes payload = 5;
  StepStatus status = 6;
  int64 next_fire_at = 7;           // for the scan-next_fire_at timer (timeout/retry)
  int32 retry_count = 8;
  string compensation_op = 9;       // registered compensation operation (03§8.4)
}

enum StepStatus {
  STEP_STATUS_UNSPECIFIED = 0;
  STEP_STATUS_PENDING = 1;          // not yet dispatched
  STEP_STATUS_DISPATCHED = 2;       // sent to executor, awaiting callback
  STEP_STATUS_COMPLETED = 3;
  STEP_STATUS_FAILED = 4;           // triggers compensation (reverse order)
  STEP_STATUS_TIMED_OUT = 5;        // intermediate-state timeout → QueryStatus, else fail+compensate
  STEP_STATUS_COMPENSATED = 6;
}

// StartFlowRequest maps to StartFlow(def_key, biz_key, payload) (03§4.3.3).
message StartFlowRequest {
  string def_key = 1;
  string biz_key = 2;
  bytes payload = 3;
}

message StartFlowResponse {
  int64 flow_instance_id = 1;
  bool already_started = 2;         // true when biz_key was idempotently matched
}

// CompleteStepRequest maps to CompleteStep(step_id, result) (03§4.3.3).
message CompleteStepRequest {
  int64 step_instance_id = 1;
  string result = 2;                // "success" | "failure"
  bytes result_payload = 3;         // executor output, e.g. produced resource_id
}

message CompleteStepResponse {
  // The next step dispatched after this one completes (empty if flow done).
  int64 next_step_instance_id = 1;
  FlowStatus flow_status = 2;
}

// CompensateFlowRequest maps to CompensateFlow(flow_instance_id) (03§4.3.3).
message CompensateFlowRequest {
  int64 flow_instance_id = 1;
}

message CompensateFlowResponse {
  FlowStatus flow_status = 1;       // COMPENSATING / COMPENSATED / FAILED
  int32 steps_compensated = 2;
}
