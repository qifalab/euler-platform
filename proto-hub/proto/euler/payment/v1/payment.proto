syntax = "proto3";

package euler.payment.v1;

option go_package = "github.com/qifalab/euler-platform/proto/euler/payment/v1;paymentv1";

// PaymentService is the payment adapter (03§4.2.3). Owns channel adaptation
// (phase 1: internal mock channel + balance payment; phase 2: third-party
// channels), payment orders & refund orders, channel-callback signature
// verification + idempotency, and channel reconciliation-file parsing.
// money is integer cents (amount_cents, int64) — never float (03§6).
service PaymentService {
  // CreatePayment is called internally by svc-order to open a payment order
  // against the chosen channel. Idempotent on the order.
  rpc CreatePayment(CreatePaymentRequest) returns (Payment);
  // ChannelCallback is the HTTP callback entry point from the payment channel.
  // Signature verification first, then idempotency via channel_txn_no, write DB
  // before emitting the event (03§4.2.3 一致性).
  rpc ChannelCallback(ChannelCallbackRequest) returns (Ack);
  rpc Refund(RefundRequest) returns (Payment);
  rpc QueryPaymentStatus(QueryPaymentStatusRequest) returns (Payment);
}

// Payment is a single payment order for a channel. The idempotency anchor is
// channel_txn_no — the same channel transaction replaying must not double-apply.
// Payment and order consistency is backstopped by bidirectional对账 (03§8.5).
message Payment {
  int64 payment_id = 1;
  int64 order_id = 2;
  int64 account_id = 3;
  string channel = 4;             // mock | balance | alipay | wechat | ...
  int64 amount_cents = 5;         // money is integer cents; never float (03§6)
  PaymentStatus status = 6;
  string channel_txn_no = 7;      // channel-side transaction no — idempotency key
  int64 created_at = 8;           // unix seconds
  int64 paid_at = 9;              // unix seconds, 0 until paid
  int64 refunded_at = 10;         // unix seconds, 0 until refunded
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;     // 待支付
  PAYMENT_STATUS_PAID = 2;        // 已支付
  PAYMENT_STATUS_FAILED = 3;      // 支付失败
  PAYMENT_STATUS_REFUNDING = 4;   // 退款中
  PAYMENT_STATUS_REFUNDED = 5;    // 已退款
}

message CreatePaymentRequest {
  int64 order_id = 1;
  int64 account_id = 2;
  string channel = 3;
  int64 amount_cents = 4;
}

message ChannelCallbackRequest {
  string channel = 1;
  // Raw body as received from the channel; the server verifies the signature
  // (sign over this body) before parsing. Idempotency resolved on channel_txn_no.
  bytes raw_body = 2;
  string signature = 3;
  string channel_txn_no = 4;
}

message RefundRequest {
  int64 payment_id = 1;
  int64 amount_cents = 2;         // partial refund allowed; <= original amount
  string reason = 3;
}

message QueryPaymentStatusRequest {
  int64 payment_id = 1;
}

message Ack {}
