syntax = "proto3";

package starcloud.monitor.v1;

option go_package = "github.com/starcloud/sc-platform/proto/starcloud/monitor/v1;monitorv1";

// MonitorService is svc-monitor (监控告警服务, 对标 CloudMonitor, 03§4.4.1). Owns
// tenant-facing alert rule CRUD + 预置规则模板, and the metric-data query proxy
// for console charts.
//
// 职责边界 (03§4.4.1 / 05§8/§9): this service does RULE MANAGEMENT and QUERY
// PROXY ONLY — it does NOT evaluate alerts. Evaluation is done by alert-engine;
// outbound notification is done by alert-center. Rules are stored in MySQL
// `alert_rule` sharded by account_id (规则数量上限按套餐分级: 免费 5 条 / 企业版
// 100 条); changes are synced to alert-engine to take effect.
service MonitorService {
  rpc PutMetricRule(PutMetricRuleRequest) returns (MetricRule);       // Monitor.PutMetricRule
  rpc DeleteMetricRule(DeleteMetricRuleRequest) returns (Ack);        // Monitor.DeleteMetricRule
  rpc DescribeMetricRules(DescribeMetricRulesRequest) returns (DescribeMetricRulesResponse); // Monitor.DescribeMetricRules
  // DescribeMetricRuleTemplates returns platform预置 templates by product_code
  // (e.g. scecs CPU/内存/磁盘), the basis for one-click rule creation.
  rpc DescribeMetricRuleTemplates(DescribeMetricRuleTemplatesRequest) returns (DescribeMetricRuleTemplatesResponse);
  // QueryMetricData proxies metric queries to the tenant VictoriaMetrics
  // cluster for console charts. The proxy MUST inject tenant filtering +
  // RAM authz + query rate-limit (05§9.3). Rule evaluation is NOT here.
  rpc QueryMetricData(QueryMetricDataRequest) returns (QueryMetricDataResponse); // Monitor.QueryMetricData
}

// MetricRule is a tenant alert rule, persisted in MySQL `alert_rule` sharded by
// account_id. Evaluation is delegated to alert-engine (this service does not
// evaluate — 03§4.4.1).
message MetricRule {
  int64 rule_id = 1;
  int64 account_id = 2;          // 分片键
  string product_code = 3;       // e.g. scecs
  string resource_type = 4;      // e.g. instance
  string metric = 5;             // e.g. cpu_utilization / memory_utilization / disk_usage
  string threshold = 6;          // decimal string; never float (03§6)
  ComparisonOperator comparison_operator = 7;
  int32 period = 8;              // evaluation period in seconds (e.g. 60)
  int32 eval_periods = 9;        // consecutive periods breached to fire (e.g. 3)
  repeated string notification_channels = 10; // in_app | sms | email | webhook
  int64 created_at = 11;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_GREATER_THAN = 1;
  COMPARISON_OPERATOR_GREATER_THAN_OR_EQUAL = 2;
  COMPARISON_OPERATOR_LESS_THAN = 3;
  COMPARISON_OPERATOR_LESS_THAN_OR_EQUAL = 4;
}

// --- Request / response messages ---

message PutMetricRuleRequest {
  int64 rule_id = 1;             // 0 = create, >0 = update
  int64 account_id = 2;
  string product_code = 3;
  string resource_type = 4;
  string metric = 5;
  string threshold = 6;
  ComparisonOperator comparison_operator = 7;
  int32 period = 8;
  int32 eval_periods = 9;
  repeated string notification_channels = 10;
}

message DeleteMetricRuleRequest {
  int64 rule_id = 1;
  int64 account_id = 2;
}

message DescribeMetricRulesRequest {
  int64 account_id = 1;
  string product_code = 2;       // optional filter
  int32 page_number = 3;
  int32 page_size = 4;
}

message DescribeMetricRulesResponse {
  repeated MetricRule rules = 1;
  int32 total_count = 2;
}

message DescribeMetricRuleTemplatesRequest {
  string product_code = 1;       // e.g. scecs
}

message DescribeMetricRuleTemplatesResponse {
  repeated MetricRuleTemplate templates = 1;
}

message MetricRuleTemplate {
  string template_name = 1;      // e.g. "CPU 使用率过高"
  string product_code = 2;
  string metric = 3;
  string default_threshold = 4;
  ComparisonOperator comparison_operator = 5;
  int32 period = 6;
  int32 eval_periods = 7;
}

message QueryMetricDataRequest {
  int64 account_id = 1;          // injected filter — caller cannot override
  string resource_id = 2;
  string metric = 3;
  int64 start_time = 4;          // unix seconds
  int64 end_time = 5;
  string aggregation = 6;        // avg | max | min | sum (default avg)
}

message QueryMetricDataResponse {
  repeated MetricPoint points = 1;
  string unit = 2;               // e.g. "%" / "bytes"
}

message MetricPoint {
  int64 timestamp = 1;           // unix seconds
  string value = 2;              // decimal string (PromQL numeric → decimal)
}

message Ack {}
