syntax = "proto3";

package starcloud.notify.v1;

option go_package = "github.com/starcloud/sc-platform/proto/starcloud/notify/v1;notifyv1";

// NotifyService is svc-notify (消息通知, 03§4.4.2). Owns notification template
// management, channel delivery (站内信/短信/邮件/WebSocket 推送), send rate-limit
// & opt-out, and notification preferences. The push-gateway component handles
// high-concurrency long connections.
//
// Ingest path: all business services publish a task to Kafka `cloud.notify.message`
// (unified task model: account_id + template_id + params + channels); svc-notify
// consumes and delivers. RPC here is for direct send (internal/synchronous) and
// for querying.
//
// 商业信任底线 (对标启示 8): 欠费催收(ARREARS)、到期提醒(EXPIRY)、释放预告
// (RELEASE_WARNING) 三类通知必须落库可查、可追溯 — they MUST be persisted and
// queryable, never fire-and-forget (03§4.4.2). Per-tenant rate limit 10/min.
service NotifyService {
  // Send delivers a notification immediately through the requested channels.
  // For trust-critical classes this creates a persisted, queryable record.
  rpc Send(SendRequest) returns (SendResponse);             // Notify.Send
  // DescribeNotifications lists the account's in-app notifications (站内信列表),
  // the documented OpenAPI-facing query (03§4.4.2).
  rpc DescribeNotifications(DescribeNotificationsRequest) returns (DescribeNotificationsResponse);
  // DescribeDelivery returns per-channel delivery status / traceability for a
  // given notification (audit the 站内信/短信/邮件 delivery outcome).
  rpc DescribeDelivery(DescribeDeliveryRequest) returns (DescribeDeliveryResponse);
}

message Notification {
  int64 notification_id = 1;
  int64 account_id = 2;          // 分片键 (R2 账号维度聚合)
  NotifyClass class = 3;
  string template_id = 4;
  map<string, string> params = 5;    // template substitution params
  repeated string channels = 6;      // in_app | sms | email | webhook | push
  NotifyStatus status = 7;
  int64 created_at = 8;          // unix seconds, UTC
  int64 sent_at = 9;
}

// NotifyClass is the notification business classification. ARREARS / EXPIRY /
// RELEASE_WARNING are 商业信任底线 classes and MUST be persisted+queryable.
enum NotifyClass {
  NOTIFY_CLASS_UNSPECIFIED = 0;
  NOTIFY_CLASS_ARREARS = 1;          // 欠费催收 — must persist (03§5.4)
  NOTIFY_CLASS_EXPIRY = 2;           // 到期提醒 — must persist (03§5.4)
  NOTIFY_CLASS_RELEASE_WARNING = 3;  // 释放预告 — must persist + audited (03§5.4)
  NOTIFY_CLASS_ALERT = 4;            // 告警 (alert-center 对客通道)
  NOTIFY_CLASS_ORDER = 5;            // 订单 / 支付
  NOTIFY_CLASS_MARKETING = 6;        // 营销 — may be suppressed/opted-out
}

enum NotifyStatus {
  NOTIFY_STATUS_UNSPECIFIED = 0;
  NOTIFY_STATUS_PENDING = 1;
  NOTIFY_STATUS_SENT = 2;
  NOTIFY_STATUS_FAILED = 3;
  NOTIFY_STATUS_SUPPRESSED = 4;      // rate-limited / opted-out / duplicate
}

// --- Request / response messages ---

message SendRequest {
  int64 account_id = 1;
  NotifyClass class = 2;
  string template_id = 3;
  map<string, string> params = 4;
  repeated string channels = 5;
  string trace_id = 6;           // end-to-end correlation (05§5)
}

message SendResponse {
  int64 notification_id = 1;     // persisted record id (esp. for trust classes)
  NotifyStatus status = 2;
  int64 suppressed_at = 3;       // set when rate-limited / suppressed (0 = not suppressed)
}

message DescribeNotificationsRequest {
  int64 account_id = 1;
  NotifyClass class = 2;         // optional filter
  int32 page_number = 3;
  int32 page_size = 4;
}

message DescribeNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total_count = 2;
}

message DescribeDeliveryRequest {
  int64 notification_id = 1;
  int64 account_id = 2;
}

message DescribeDeliveryResponse {
  repeated ChannelDelivery deliveries = 1;
}

message ChannelDelivery {
  string channel = 1;            // in_app | sms | email | webhook | push
  NotifyStatus status = 2;
  string provider_msg_id = 3;    // upstream SMS/email provider id for trace
  int32 retry_count = 4;
  int64 sent_at = 5;
  int64 failed_at = 6;
}
