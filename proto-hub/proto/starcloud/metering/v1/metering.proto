syntax = "proto3";

package starcloud.metering.v1;

option go_package = "github.com/starcloud/sc-platform/proto/starcloud/metering/v1;meteringv1";

// MeteringService is the metering collection & aggregation pipeline
// (03§4.2.5 / 05§5.5). Owns collection of raw usage from each rc-* controller
// (event push + scheduled pull dual-channel), cleaning & dedup, hourly
// aggregation per resource x item, and production of billing input + metering
// detail archive. High-frequency write pipeline targeting 10k msg/s; no complex
// transactions (03§4.2.5) — an Go data-ingestion service.
service MeteringService {
  // PushMeteringData is a client-streaming RPC for rc-* controllers / host
  // agents to push raw usage points in batch. Each record carries a
  // deterministic record_id idempotency key; retries dedup on it.
  rpc PushMeteringData(stream UsageRecord) returns (PushMeteringDataResponse);
  // DescribeMeteringData queries raw or aggregated usage for a resource over a
  // time range (Billing.DescribeMeteringData).
  rpc DescribeMeteringData(DescribeMeteringDataRequest) returns (DescribeMeteringDataResponse);
}

// UsageRecord is a raw usage point pushed by a product controller / host agent
// (event.proto UsageRecord, 05§5.5.1). The idempotency key is deterministic:
// record_id = sha1(resource_id|item|window_start)[0:24], so a re-pushed point
// with the same key is deduped rather than double-counted.
message UsageRecord {
  string record_id = 1;           // deterministic idempotency key sha1(resource|item|window)[0:24]
  int64 account_id = 2;
  string region = 3;
  string resource_type = 4;       // ecs | oss | rds | ...
  string resource_id = 5;
  string metering_item = 6;       // cpu_seconds | storage_gb_hour | ...
  string quantity = 7;            // decimal string; never float for units (03§6)
  int64 window_start = 8;         // unix seconds, minute-aligned
  int32 window_seconds = 9;       // usually 60
  int64 collect_ts = 10;          // collection timestamp
  string collector_id = 11;
  string batch_id = 12;           // "rt" | "late"
  string trace_id = 13;
}

// HourlyUsage is the hourly aggregate produced by svc-metering and consumed by
// svc-billing for deduction. Idempotency key agg_id = sha1(resource|item|hour)[0:24].
// covered_ratio in 0-100; <100 triggers a backfill re-aggregation (05§5.5.2 L1).
message HourlyUsage {
  string agg_id = 1;              // sha1(resource_id|item|hour)[0:24]
  int64 account_id = 2;
  string region = 3;
  string resource_type = 4;
  string resource_id = 5;
  string metering_item = 6;
  string total_quantity = 7;      // decimal string
  int64 hour_start = 8;           // on the hour, unix seconds
  int32 covered_ratio = 9;        // 0-100; <100 triggers backfill (05§5.5.2 L1)
  int64 produced_ts = 10;
  string batch_id = 11;
}

message PushMeteringDataResponse {
  int32 accepted = 1;             // count of accepted (non-deduped) records
  int32 deduped = 2;              // count of records dropped as duplicates
}

message DescribeMeteringDataRequest {
  int64 account_id = 1;
  string resource_id = 2;
  string metering_item = 3;
  int64 start_time = 4;           // unix seconds
  int64 end_time = 5;             // unix seconds
  bool aggregated = 6;            // true=hourly aggregates, false=raw points
}

message DescribeMeteringDataResponse {
  repeated UsageRecord raw = 1;       // when aggregated=false
  repeated HourlyUsage hourly = 2;    // when aggregated=true
}
