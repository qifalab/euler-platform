syntax = "proto3";

package starcloud.order.v1;

option go_package = "github.com/starcloud/sc-platform/proto/starcloud/order/v1;orderv1";

// OrderService is the order center (03§4.2.2 / 01§12.3). Owns the unified
// order model across the five order types — new purchase / renew / resize-up /
// resize-down / refund (新购/续费/升配/降配/退订), the 询价→锁价→下单→支付驱动→
// 履约触发→退订退款 full flow, and refund orchestration (对标启示 9, 01§12.3).
// It is the commercialization hub: strong transactions + a state machine +
// decimal money precision (03§4.2.2), backed by MySQL sharded by account_id.
service OrderService {
  // CreateOrder creates a draft order. Idempotency key is client_token — the
  // caller (console/site BFF) mints it once per user intent; retrying with the
  // same token returns the same order instead of duplicating it (Order.CreateOrder).
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  // PayNotify is invoked by svc-payment after a successful (or failed) payment
  // charge; idempotent on order_id. Only the paid->fulfilling transition here
  // triggers provisioning (03§4.2.2 关键规则).
  rpc PayNotify(PayNotifyRequest) returns (Ack);
  rpc RenewOrder(RenewOrderRequest) returns (Order);
  rpc ResizeOrder(ResizeOrderRequest) returns (Order);
  rpc RefundOrder(RefundOrderRequest) returns (Order);
  rpc DescribeOrders(DescribeOrdersRequest) returns (DescribeOrdersResponse);
}

// Order is the unified order model. money is decimal string (string, never
// float — 03§6), ids are int64. The price was frozen by svc-catalog at下单 time
// (PriceSnapshot); amounts here mirror that snapshot (01§12.3).
message Order {
  int64 order_id = 1;
  int64 account_id = 2;
  OrderType order_type = 3;
  string product_code = 4;        // sc-prefixed, e.g. scecs
  ChargeType charge_type = 5;     // prepaid | postpaid | resource_pack
  string sku_code = 6;
  string region_id = 7;
  string snapshot_id = 8;         // frozen price snapshot from svc-catalog
  string list_amount = 9;         // decimal string
  string promo_amount = 10;       // decimal string
  string coupon_amount = 11;      // trial-voucher抵扣, decimal string
  string payable_amount = 12;     // decimal string — what the account actually owes
  OrderStatus status = 13;
  string resource_id = 14;        // filled on fulfillment (empty until then)
  string client_token = 15;       // idempotency key, one per user intent
  int32 version = 16;             // optimistic lock for state transitions
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_NEW = 1;             // 新购
  ORDER_TYPE_RENEW = 2;           // 续费
  ORDER_TYPE_RESIZE_UP = 3;       // 升配
  ORDER_TYPE_RESIZE_DOWN = 4;     // 降配
  ORDER_TYPE_REFUND = 5;          // 退订
}

enum ChargeType {
  CHARGE_TYPE_UNSPECIFIED = 0;
  CHARGE_TYPE_PREPAID = 1;        // 包年包月
  CHARGE_TYPE_POSTPAID = 2;       // 按量
  CHARGE_TYPE_RESOURCE_PACK = 3;  // resource pack (deferred phase 2)
}

// OrderStatus mirrors the trade-domain state machine (event.proto OrderState):
// 1待支付 2已支付 3履约中 4已完成 5已取消 6已关闭(未支付超时) 7已退款.
// paid->fulfilling is the ONLY provisioning trigger (03§4.2.2).
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING_PAYMENT = 1; // 待支付
  ORDER_STATUS_PAID = 2;            // 已支付 — ready to fulfill
  ORDER_STATUS_FULFILLING = 3;      // 履约中
  ORDER_STATUS_COMPLETED = 4;       // 已完成
  ORDER_STATUS_CANCELLED = 5;       // 已取消
  ORDER_STATUS_CLOSED = 6;          // 已关闭(超时未支付)
  ORDER_STATUS_REFUNDED = 7;        // 已退款
}

message CreateOrderRequest {
  int64 account_id = 1;
  OrderType order_type = 2;
  string product_code = 3;
  string sku_code = 4;
  string region_id = 5;
  int32 quantity = 6;
  int32 duration = 7;             // 0 for postpaid
  string duration_unit = 8;       // MONTH | YEAR | HOUR | USAGE
  string coupon_id = 9;           // trial voucher to apply (D7)
  // Client-generated idempotency key. The server stores it in a unique index;
  // a replay with the same (account_id, client_token) returns the existing order.
  string client_token = 10;
}

message PayNotifyRequest {
  int64 order_id = 1;
  int64 payment_id = 2;
  bool success = 3;               // channel charge outcome
  string channel = 4;
  string channel_txn_no = 5;      // idempotency basis from the channel
}

message RenewOrderRequest {
  int64 account_id = 1;
  int64 order_id = 2;             // the original order being renewed
  string resource_id = 3;
  int32 duration = 4;             // renewal duration
  string duration_unit = 5;
  string client_token = 6;
}

message ResizeOrderRequest {
  int64 account_id = 1;
  int64 order_id = 2;             // original order being resized
  string resource_id = 3;
  string sku_code = 4;            // target SKU (up or down)
  OrderType order_type = 5;       // RESIZE_UP | RESIZE_DOWN
  string client_token = 6;
}

message RefundOrderRequest {
  int64 account_id = 1;
  int64 order_id = 2;
  string reason = 3;
  // 退订走"先冻结资源 → 编排释放 → 确认退款",禁止先退钱后删资源 (03§4.2.2).
  string client_token = 4;
}

message DescribeOrdersRequest {
  int64 account_id = 1;
  OrderStatus status = 2;         // optional filter
  int32 page_number = 3;
  int32 page_size = 4;
}

message DescribeOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
}

message Ack {}
