syntax = "proto3";

package starcloud.org.v1;

option go_package = "github.com/starcloud/sc-platform/proto/starcloud/org/v1;orgv1";

// OrgService is svc-org (组织与项目, 03§4.1.2). Owns the resource directory
// (企业多账号后置), project (resource group) CRUD, resource ownership & moves,
// and the unified Tag system.
//
// Tags are the common language for cost analysis AND authorization — the model
// must be stable from day one ("标签是成本分析与权限的公共语言,模型第一天就要稳").
// svc-org is a Day-1 foundational service (03§11 phase 1: svc-org 项目从简).
service OrgService {
  // CreateProject creates a project (resource group). Emits no cross-domain
  // event; svc-order / svc-orchestrator validate project ownership against this.
  rpc CreateProject(CreateProjectRequest) returns (Project);   // Org.CreateProject
  rpc UpdateProject(UpdateProjectRequest) returns (Project);   // Org.UpdateProject
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse); // Org.ListProjects
  // MoveResource reassigns a resource to another project. The resource remains
  // owned by the same account; only project_id changes. svc-orchestrator is the
  // resource_instance owner, so a move is a coordination call, not a direct write.
  rpc MoveResource(MoveResourceRequest) returns (Ack);         // Org.MoveResource
  rpc TagResources(TagResourcesRequest) returns (Ack);         // Tag.TagResources
  rpc UntagResources(UntagResourcesRequest) returns (Ack);     // Tag.UntagResources
}

// Project is a resource group (资源组). project_id is the aggregation root for
// grouping; parent_id supports the resource-directory hierarchy (企业多账号后置).
message Project {
  int64 project_id = 1;          // snowflake, 全局标识规范
  int64 account_id = 2;          // 分片键 (R2 账号维度聚合)
  string name = 3;               // unique within account
  int64 parent_id = 4;           // 0 = root (资源目录后置前恒为 0)
  int64 created_at = 5;          // unix seconds, UTC
  int64 updated_at = 6;
}

// Tag is a {key,value} pair. The unified vocabulary across cost analysis and
// authorization — the platform tag schema (key namespace / reserved keys) must
// be agreed before the first resource is tagged (03§4.1.2).
message Tag {
  string key = 1;
  string value = 2;
}

// --- Request / response messages ---

message CreateProjectRequest {
  int64 account_id = 1;
  string name = 2;
  int64 parent_id = 3;           // optional; 0 = root
}

message UpdateProjectRequest {
  int64 project_id = 1;
  string name = 2;
}

message ListProjectsRequest {
  int64 account_id = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message ListProjectsResponse {
  repeated Project projects = 1;
  int32 total_count = 2;
}

// MoveResource reassigns a resource to a target project. resource_id follows the
// 全局标识规范 {productCode}-{region}-{shard}-{rand} (03§5.1); account_id must
// match both current and target project's owning account (no cross-account move).
message MoveResourceRequest {
  string resource_id = 1;
  int64 account_id = 2;
  int64 project_id = 3;          // target project (must belong to same account)
}

message TagResourcesRequest {
  int64 account_id = 1;
  repeated string resource_ids = 2;  // ARNs / resource ids to tag
  repeated Tag tags = 3;             // applied as a set (upsert)
}

message UntagResourcesRequest {
  int64 account_id = 1;
  repeated string resource_ids = 2;
  repeated string tag_keys = 3;      // only keys, values not required for removal
}

message Ack {}
