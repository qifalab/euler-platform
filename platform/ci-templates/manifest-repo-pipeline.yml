# Manifest repository pipeline (08-devops-delivery §5.5).
#
# The manifest repo is the GitOps source of truth, so its own pipeline is the
# last gate before ArgoCD applies anything to a cluster. Jobs run on every MR;
# prod/ changes additionally require SRE + service Owner dual approval via
# CODEOWNERS (08§4.2).

stages: [lint, validate, diff]

variables:
  PYTHON_IMAGE: python:3.12-slim

# ---------------------------------------------------------------------------
# Syntax: every manifest must parse.
# ---------------------------------------------------------------------------
lint:yaml:
  stage: lint
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet pyyaml
  script:
    - python tools/check-yaml-syntax.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# K8s schema conformance.
# ---------------------------------------------------------------------------
lint:kubeconform:
  stage: lint
  # Pinned (supply chain): a moving :latest tag lets a registry push change what CI runs.
  # The image's entrypoint is the kubeconform binary itself; reset it so the
  # runner can execute the script in the image's shell (busybox, -alpine tag).
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine
    entrypoint: [""]
  variables:
    # Helm is not in the kubeconform image: fetch a pinned, checksummed
    # release (keep the version in step with Argo CD's bundled Helm).
    HELM_VERSION: v3.16.4
    HELM_SHA256: fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179
  before_script:
    - wget -q -O /tmp/helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
    - echo "${HELM_SHA256}  /tmp/helm.tgz" | sha256sum -c -
    - tar -xzf /tmp/helm.tgz -C /tmp && install /tmp/linux-amd64/helm /usr/local/bin/helm
  script:
    # Helm charts carry Go directives, so render them before validating —
    # exactly as the ApplicationSet does: release name = chart dir, namespace
    # euler-<svc>, chart defaults plus every envs/<region>/<env> override.
    - |
      set -e
      mkdir -p /tmp/rendered
      for chart in deploy/gitops-manifests/apps/*/; do
        svc=$(basename "$chart")
        helm template "$svc" "$chart" --namespace "euler-$svc" > "/tmp/rendered/$svc.default.yaml"
        for values in deploy/gitops-manifests/envs/*/*/values-overrides/"$svc".yaml; do
          [ -f "$values" ] || continue
          env_tag=$(echo "$values" | cut -d/ -f4,5 | tr / _)
          helm template "$svc" "$chart" --namespace "euler-$svc" -f "$values" > "/tmp/rendered/$svc.$env_tag.yaml"
        done
      done
      kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered/
    # Raw platform manifests: only the Kubernetes objects. The APISIX
    # data-plane config (platform/apisix/config/) and route tables
    # (platform/apisix/routes/) are APISIX files, not Kubernetes resources
    # (no apiVersion/kind) — they are validated by validate:apisix-routes.
    - kubeconform -strict -summary -ignore-missing-schemas
        deploy/gitops-manifests/platform/middleware/
        deploy/gitops-manifests/platform/apisix/apisix-deployment.yaml
        deploy/gitops-manifests/platform/apisix/kustomization.yaml
        deploy/gitops-manifests/applicationset.yaml
        deploy/gitops-manifests/app-of-apps.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Gateway semantics. YAML validity is not enough — the failures that matter
# here are semantic and silent in production: a route without eu-auth is an
# unauthenticated endpoint; a Nacos subscription string in the wrong form
# resolves to zero upstreams and the route simply 502s.
# ---------------------------------------------------------------------------
validate:apisix-routes:
  stage: validate
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet pyyaml
  script:
    - python tools/check-apisix-routes.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

validate:lua-plugins:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache lua5.1 luarocks python3 py3-pip build-base python3-dev
    - luarocks-5.1 install luacheck
    - pip3 install --break-system-packages lupa==2.8
  script:
    # Structural contract check (module table, check_schema, priority) and
    # identity-header strip coverage.
    - python3 tools/check-lua-plugins.py
    # Behavioural security tests of eu-auth under a real Lua VM (header
    # stripping, RS256 pinning, internal-token injection).
    - python3 tools/test-lua-plugins.py
    # Real Lua linting once the interpreter is available in CI.
    - luacheck deploy/gitops-manifests/platform/apisix/plugins/ --no-color
        --globals ngx --std max
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Cross-AZ topology (M-6.2c, 00§4.4 P2). A stateful workload (Kafka/MySQL/
# Redis) that is NOT spread across AZs silently breaks the AZ-loss survival
# contract — the failure is invisible until an AZ actually fails. This checks
# the placement intent that kubeconform's schema check cannot express.
# ---------------------------------------------------------------------------
validate:topology-spread:
  stage: validate
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet pyyaml
  script:
    - python tools/check-topology-spread.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# IDL breaking-change gate (M-5.3, R14, 03§9.4). proto-hub is the single source
# of truth; a wire-breaking change (field number removed/retyped/reused, a proto3
# `required`, an unversioned package) must not ship without an architecture-
# committee sign-off + a major-version bump. buf is the real gate; this source
# checker runs everywhere python runs. See proto-hub/VERSIONING.md.
# ---------------------------------------------------------------------------
validate:proto-breaking:
  stage: validate
  image: $PYTHON_IMAGE
  script:
    - python tools/check-proto-breaking.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Policy admission (OPA/Kyverno dry-run).
# ---------------------------------------------------------------------------
validate:policy:
  stage: validate
  # Pinned (supply chain): a moving :latest tag lets a registry push change what CI runs.
  image: openpolicyagent/conftest:v0.71.0
  script:
    - conftest test deploy/gitops-manifests/platform/ --policy policies/
  allow_failure: true      # advisory until the policy set is complete
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Show the operator exactly what will change in the cluster before approval.
# Read-only credentials; ArgoCD does the applying.
# ---------------------------------------------------------------------------
diff:argocd:
  stage: diff
  # Pinned (supply chain): a moving :latest tag lets a registry push change what CI runs.
  # Docker Hub's argoproj/argocd is no longer updated (its :latest is a v2.6
  # build); the project publishes to quay.io. Keep this in step with the
  # cluster's Argo CD server version.
  image: quay.io/argoproj/argocd:v3.5.3
  script:
    - argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_READONLY_TOKEN" --grpc-web
    - |
      for app in $(argocd app list -o name); do
        echo "=== $app ==="
        argocd app diff "$app" --refresh || true
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
