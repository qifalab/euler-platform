# Application repository CI pipeline (08-devops-delivery.md §5.3).
#
# This pipeline runs once per Go SERVICE of the monorepo (svc-*, console-bff,
# alert-center, ...): include it with SERVICE set to the service directory
# (and MAIN when the main binary is not cmd/server). It builds, tests, scans,
# and publishes the container image, then triggers the manifest repo to update
# the Helm chart version. The manifest repo's own pipeline
# (manifest-repo-pipeline.yml) is the last gate before ArgoCD applies.
#
#   include:
#     - local: platform/ci-templates/app-repo-pipeline.yml
#   variables:
#     SERVICE: services/svc-iam
#     MAIN: web-auth
#
# Trigger: every MR + main push. Image tag = commit SHA (immutable); the manifest
# repo bumps the chart's image.tag on merge via the trigger job.
stages: [verify, build, scan, publish, trigger]

variables:
  # Pinned patch: stdlib fixes for GO-2026-6218/6090/5972/5856/5039/... land in
  # go1.26.6 — a floating 1.26 tag can resolve an older cached image.
  GO_IMAGE: golang:1.26.6
  # harbor.internal/cloudplatform/<svc> — set per-service in CI/CD settings
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  # Service directory relative to the repository root (REQUIRED), e.g.
  # services/svc-order. Each service is its own Go module with
  # `replace ... => ../../pkg-go`, so it is built from the repo root.
  SERVICE: ""
  # cmd/<MAIN> becomes the image entrypoint /app/app; every other cmd/* is
  # shipped as /app/<dir> (svc-iam: MAIN=web-auth, plus /app/verify).
  MAIN: server
  # The one service Dockerfile (Go 1.26 builder, distroless runtime).
  DOCKERFILE: services/_tmpl-go/deploy/Dockerfile

# ---------------------------------------------------------------------------
# Verify: go vet + go test (the service's own + the shared pkg-go replace).
# ---------------------------------------------------------------------------
verify:vet:
  stage: verify
  image: $GO_IMAGE
  script:
    - test -n "$SERVICE" || { echo "SERVICE (e.g. services/svc-order) is required" >&2; exit 1; }
    - cd "$SERVICE"
    - go vet ./...
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify:test:
  stage: verify
  image: $GO_IMAGE
  script:
    - cd "$SERVICE"
    - go test -race -count=1 ./...   # -race needs cgo; CI runner has gcc
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Build: multi-stage Dockerfile (every cmd/* of the service, cmd/$MAIN as the
# entrypoint) → distroless image. Context = repository root so the service's
# `replace ../../pkg-go` resolves inside the build.
# ---------------------------------------------------------------------------
build:image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - test -n "$SERVICE" || { echo "SERVICE (e.g. services/svc-order) is required" >&2; exit 1; }
    - /kaniko/executor
        --context="$CI_PROJECT_DIR"
        --dockerfile="$CI_PROJECT_DIR/$DOCKERFILE"
        --build-arg="SERVICE=$SERVICE"
        --build-arg="MAIN=$MAIN"
        --build-arg="GO_IMAGE=$GO_IMAGE"
        --build-arg="GIT_SHA=$CI_COMMIT_SHORT_SHA"
        --destination="$IMAGE"
        --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Scan: trivy on the built image (supply-chain, 07§5.4).
# ---------------------------------------------------------------------------
scan:trivy:
  stage: scan
  image:
    # Pinned (supply chain): a moving :latest tag lets a registry push change what CI runs.
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL "$IMAGE"
  needs: ["build:image"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Publish: the kaniko build already pushed to the registry; here we tag the
# commit SHA as a version anchor for rollback.
# ---------------------------------------------------------------------------
publish:tag:
  stage: publish
  image: $GO_IMAGE
  script:
    - echo "published $IMAGE"
  needs: ["build:image", "scan:trivy"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Trigger: tell the manifest repo to bump this service's image.tag to the new
# SHA. The manifest repo's pipeline then validates + ArgoCD syncs.
# ---------------------------------------------------------------------------
trigger:manifest:
  stage: trigger
  # Pinned (supply chain): a moving :latest tag lets a registry push change what CI runs.
  image: curlimages/curl:8.22.0
  script:
    - |
      curl -X POST --fail
        -F "token=$MANIFEST_TRIGGER_TOKEN"
        -F "ref=main"
        -F "variables[SVC]=${SERVICE##*/}"
        -F "variables[IMAGE_TAG]=$CI_COMMIT_SHORT_SHA"
        "$CI_API_V4_URL/projects/$MANIFEST_PROJECT_ID/trigger/pipeline"
  needs: ["publish:tag"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
