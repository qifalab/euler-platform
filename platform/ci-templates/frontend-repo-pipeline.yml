# Frontend monorepo CI pipeline (08-devops-delivery.md §5.3, 02§9.4).
#
# Runs in the frontend monorepo (eu-frontend-platform). Builds shared @eu/*
# packages, runs Vitest unit tests, builds all apps, and publishes the shell +
# sub-app entries to object storage (MinIO) — the Wujie entries the console
# loads at runtime (02§2.3).
stages: [install, verify, build, publish]

variables:
  NODE_IMAGE: node:22-alpine
  PNPM_VERSION: "11"

# ---------------------------------------------------------------------------
# Install: pnpm with frozen lockfile (reproducible, 02§9.1).
# ---------------------------------------------------------------------------
install:
  stage: install
  image: $NODE_IMAGE
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
  script:
    - pnpm install --frozen-lockfile
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
  artifacts:
    paths:
      - node_modules/
      - packages/*/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Verify: typecheck + Vitest unit tests (02§9.4 — public packages ≥80% branch).
# ---------------------------------------------------------------------------
verify:typecheck:
  stage: verify
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify:test:
  stage: verify
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Build: packages first (apps consume dist/), then all apps.
# ---------------------------------------------------------------------------
build:packages:
  stage: build
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm build:packages
  artifacts:
    paths:
      - packages/*/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:apps:
  stage: build
  image: $NODE_IMAGE
  needs: ["build:packages"]
  script:
    - corepack enable
    - pnpm --filter './apps/*' build
  artifacts:
    # Vite apps build to dist/; docs-site (VitePress) to .vitepress/dist/;
    # site (Nuxt) to .output/ — all of them feed publish:entries.
    paths:
      - apps/*/dist/
      - apps/*/.vitepress/dist/
      - apps/*/.output/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Publish: upload shell + sub-app entries to MinIO (the static.euler.emoera.com
# source). Versioned dir = immutable; the manifest repo bumps the registry.
# ---------------------------------------------------------------------------
publish:entries:
  stage: publish
  # TODO(supply chain): pin this. minio/mc on Docker Hub now requires
  # credentials, so no tag could be verified here — mirror a vetted release
  # (RELEASE.YYYY-MM-DDThh-mm-ssZ) into harbor.internal and reference it by tag.
  # The image's entrypoint is `mc`; reset it so the job script runs in sh.
  image:
    name: minio/mc:latest
    entrypoint: [""]
  needs: ["build:apps"]
  script:
    - mc alias set euler "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
    # Shell → shell/<sha>/index.html (02§2.3)
    - mc cp --recursive apps/console-base/dist/ euler/static/shell/$CI_COMMIT_SHORT_SHA/
    # Every other app under apps/ → apps/<app>/<sha>/index.html. The list is
    # derived from the directory, not hand-kept (a hard-coded list silently
    # skipped every app added after it was written), and any missing build or
    # failed upload fails the job — a half-published release must not be
    # promoted by the registry bump.
    - |
      set -e
      for dir in apps/*/; do
        app=$(basename "$dir")
        [ "$app" = console-base ] && continue
        out=""
        for cand in dist .vitepress/dist .output/public; do
          if [ -d "apps/$app/$cand" ]; then out="apps/$app/$cand"; break; fi
        done
        if [ -z "$out" ] || [ -z "$(ls -A "$out")" ]; then
          echo "no build output for apps/$app (dist/, .vitepress/dist/ or .output/public/)" >&2
          exit 1
        fi
        mc cp --recursive "$out/" "euler/static/apps/$app/$CI_COMMIT_SHORT_SHA/"
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
