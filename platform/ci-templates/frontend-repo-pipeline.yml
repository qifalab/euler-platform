# Frontend monorepo CI pipeline (08-devops-delivery.md §5.3, 02§9.4).
#
# Runs in the frontend monorepo (sc-frontend-platform). Builds shared @sc/*
# packages, runs Vitest unit tests, builds all apps, and publishes the shell +
# sub-app entries to object storage (MinIO) — the Wujie entries the console
# loads at runtime (02§2.3).
stages: [install, verify, build, publish]

variables:
  NODE_IMAGE: node:22-alpine
  PNPM_VERSION: "11"

# ---------------------------------------------------------------------------
# Install: pnpm with frozen lockfile (reproducible, 02§9.1).
# ---------------------------------------------------------------------------
install:
  stage: install
  image: $NODE_IMAGE
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
  script:
    - pnpm install --frozen-lockfile
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/
  artifacts:
    paths:
      - node_modules/
      - packages/*/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Verify: typecheck + Vitest unit tests (02§9.4 — public packages ≥80% branch).
# ---------------------------------------------------------------------------
verify:typecheck:
  stage: verify
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

verify:test:
  stage: verify
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Build: packages first (apps consume dist/), then all apps.
# ---------------------------------------------------------------------------
build:packages:
  stage: build
  image: $NODE_IMAGE
  needs: ["install"]
  script:
    - corepack enable
    - pnpm build:packages
  artifacts:
    paths:
      - packages/*/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:apps:
  stage: build
  image: $NODE_IMAGE
  needs: ["build:packages"]
  script:
    - corepack enable
    - pnpm --filter './apps/*' build
  artifacts:
    paths:
      - apps/*/dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Publish: upload shell + sub-app entries to MinIO (the static.starcloud.cn
# source). Versioned dir = immutable; the manifest repo bumps the registry.
# ---------------------------------------------------------------------------
publish:entries:
  stage: publish
  image: minio/mc:latest
  needs: ["build:apps"]
  script:
    - mc alias set starcloud "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
    # Shell → shell/<sha>/index.html (02§2.3)
    - mc cp --recursive apps/console-base/dist/ starcloud/static/shell/$CI_COMMIT_SHORT_SHA/
    # Each sub-app → apps/<app>/<sha>/index.html
    - |
      for app in console-ecs console-storage console-network console-database console-monitor web-account web-billing web-ticket site docs-site; do
        mc cp --recursive apps/$app/dist/ starcloud/static/apps/$app/$CI_COMMIT_SHORT_SHA/ || true
      done
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
