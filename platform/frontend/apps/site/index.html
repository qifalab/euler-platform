<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="辰云(StarCloud)云平台 — 云服务器、对象存储、块存储、专有网络、云数据库、云监控、弹性公网 IP。"
    />
    <title>辰云 StarCloud — 云平台</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="/">辰云 StarCloud</a>
        <nav class="main-nav">
          <a href="#products">全部产品</a>
          <a href="https://console.starcloud.cn">控制台</a>
          <a href="https://docs.starcloud.cn">文档</a>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <h1>稳定、安全的云上基础设施</h1>
        <p>以虚拟化、SDN、分布式存储与可观测能力为底座,支撑业务从部署到规模化。</p>
        <a class="btn btn-primary" href="https://console.starcloud.cn">进入控制台</a>
      </div>
    </section>

    <section id="products" class="products">
      <div class="container">
        <h2>全部产品</h2>
        <p class="section-sub">一期七个产品,覆盖计算、存储、网络、数据库与监控。</p>
        <div class="product-grid" id="product-grid">
          <!-- Product cards rendered from the product catalog below -->
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container">
        <p>© 辰云 StarCloud · starcloud.cn</p>
      </div>
    </footer>

    <script>
      // Product catalog, condensed from docs/architecture/01-product-catalog.md §2.
      var PRODUCTS = [
        { code: "SCVPC", name: "辰云专有网络", desc: "租户逻辑隔离网络,一切资源的网络边界。", link: "https://docs.starcloud.cn/scvpc" },
        { code: "SCECS", name: "辰云服务器", desc: "云上虚拟服务器,一切资源的基础算力载体。", link: "https://docs.starcloud.cn/scecs" },
        { code: "SCBS", name: "辰云块存储", desc: "挂载云服务器的高性能云盘,快照与回滚。", link: "https://docs.starcloud.cn/scbs" },
        { code: "SCOSS", name: "辰云对象存储", desc: "RESTful 海量非结构化存储,S3 兼容 API。", link: "https://docs.starcloud.cn/scoss" },
        { code: "SCRDS", name: "辰云数据库 MySQL 版", desc: "托管 MySQL 关系型数据库,一主一备高可用。", link: "https://docs.starcloud.cn/scrds" },
        { code: "SCMON", name: "辰云监控", desc: "资源与自定义指标监控、告警与通知。", link: "https://docs.starcloud.cn/scmon" },
        { code: "SCEIP", name: "弹性公网 IP", desc: "可独立购买与动态绑定的公网地址。", link: "https://docs.starcloud.cn/sceip" },
      ];

      var grid = document.getElementById("product-grid");
      PRODUCTS.forEach(function (p) {
        var card = document.createElement("article");
        card.className = "product-card";
        var badge = document.createElement("span");
        badge.className = "product-badge";
        badge.textContent = p.code;
        var name = document.createElement("h3");
        name.textContent = p.name;
        var desc = document.createElement("p");
        desc.textContent = p.desc;
        var link = document.createElement("a");
        link.href = p.link;
        link.className = "product-link";
        link.textContent = "查看文档 →";
        card.append(badge, name, desc, link);
        grid.appendChild(card);
      });
    </script>
  </body>
</html>
