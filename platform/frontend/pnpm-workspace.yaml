# pnpm workspace for the Euler frontend.
# Public shared packages live under packages/ (published as @eu/* from a
# private registry in production; here they are workspace: protocol deps).
# Each app under apps/ is an independent build target.
packages:
  - "packages/*"
  - "apps/*"
# pnpm 11 blocks package install scripts by default (supply-chain safety).
# esbuild ships a platform binary postinstall that vite needs at build time;
# vue-demi's postinstall switches the active Vue version for element-plus.
allowBuilds:
  esbuild: true
  vue-demi: true
# Dependabot fixes (GHSA-5xrq-8626-4rwp / GHSA-fx2h-pf6j-xcff / GHSA-w27v-7q3p-w38r):
# pin the audit-flagged transitive deps. pnpm 11 reads overrides from THIS file,
# not from package.json#pnpm.
overrides:
  svgo: 4.1.0
  esbuild: 0.25.12
  vite: 6.4.3
# pnpm 11 reads linker/layout settings from THIS file (project .npmrc is no longer
# consulted for these). hoisted = npm-style flat node_modules.
# Why: on this repo's Windows dev box, pnpm's default isolated(.pnpm) linker deadlocks
# during the store->project import step, and leaves empty dirs instead of links in
# per-package node_modules. hoisted needs almost no junctions and is the most
# GitHub/onboarding-friendly layout (single `node_modules/` ignore, no .pnpm noise).
nodeLinker: hoisted
# Flatten transitive deps into the root node_modules too, so packages that assume
# classic "walk up to node_modules" resolution keep working under hoisted.
shamefullyHoist: true
# Do NOT auto-run a dependency-status check (which spawns a nested `pnpm install`)
# before every `pnpm run`/`pnpm -r` command. On this Windows dev box that nested
# install intermittently deadlocks, which makes even `pnpm -r typecheck` hang.
verifyDepsBeforeRun: false
